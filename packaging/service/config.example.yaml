# This selected config serves nothing until roots are supplied.
# Roots accept absolute paths, ~/ paths and $TMPDIR with an optional child path.
version: 1
serve:
  roots: []

# Annotation length: Unicode code points, from 1 to 16384; default 4000.
# The independent 16 KiB UTF-8 text ceiling also applies. Restart to change.
# annotations:
#   max-chars: 4000

# Optional initial folding; uncomment to override the document's own settings.
# headers is a mapping, not the former scalar open/closed value.
# folding:
#   override:
#     headers:
#       default: open
#       todo: open
#       done: closed
#     drawers: closed
#     default: open
