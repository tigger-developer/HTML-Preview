            Verified
            - RT019.1 (diagram rendering boundary, internal/preview/diagram_test.go) is GREEN with a valid intended-reason RED (2026-10-04: zero diagram images rendered); UT019.1 is AMBER with a recorded reason, which this gate permits.
            - Implemented tests match the recorded RT019.1 boundary: public preview with captured renderers, two PNG img nodes with both literal sources retained, PlantUML SANDBOX environment and private session directory, 256 KiB source-bound rejection, service PATH including mmdc/plantuml (RT018_1 amendment), and the package formula (RT001_14: mermaid-cli and plantuml depends_on).
            - Production delta conforms to the operator-authorized scope and recorded design: strict Mermaid config (securityLevel strict, htmlLabels false, startOnLoad false, maxTextSize matching the 256 KiB bound), PlantUML -pipe with stdin source, SANDBOX profile and 256 MiB heap, direct argv execution with no shell, per-page limit of 32 diagrams, output-byte budget accounting, shared request deadline, PNG magic verification before publication, and failure fallback to retained source with a bounded notice and retryable (uncacheable) service pages. Figure/figcaption presentation uses the owned stylesheet with meaningful alt text.
            - No unauthorized scope or unjustified complexity: the packaging, service PATH and formula changes are required by AC019.3; no new Go dependencies; browser script and passive-content policy untouched.
            - Affected product documentation is current and accurate: README v10, INSTALLATION v3, READING v3, ARCHITECTURE v13 and htmlpreview-help.txt describe the delivered limits, prerequisites and fallback consistently with the code; changed passages are impersonal and factual.
            - No duplicated audit state: spec.org and work.org only link to audits.yaml; validation.org carries execution states and the tested revision, which are permitted test evidence.

            Provisional condition (bounded, reversible; does not invalidate implementation sign-off)
            1. Service-mode diagram publication is unverified. The authorized scope includes file/service PNG publication, but the supplied evidence exercises only the file transport, and the delta calls imageResolver(p, "", "image/png", output) with an empty media name for every diagram; the W018 resolver implementation was not supplied, so distinct-URL keying for two diagrams on one served page could not be confirmed. Required: verify one service-rendered page containing at least two distinct diagram blocks publishes two distinct, correct PNGs (a focused service check, or fold it into the pending operator UT019.1), and record the observation in validation.org.

            Limitations and notes (not conditions)
            - SDLC ARCHITECTURE.md, DOCUMENTATION.md, ORG-SCHEMA.md and CODING.md were not in the supplied manifest; documentation-voice and structural checks were made against the supplied standards and project architecture only.
            - No lint/vet execution for this candidate appears in the supplied record (GO.md lists golangci-lint as required); it may exist outside the supplied set, so this is not raised as a finding.
            - Minor code-quality note for wrap-up: readGeneratedPNG defers f.Close() without checking the error; inconsequential for a read-only descriptor.
            - Failed diagram attempts consume the per-page count budget before renderer/budget checks; a bounded reading of "32 diagrams", recorded here as a routine detail.
            - Only Markdown fences were exercised end-to-end; Org source blocks ride the same shared transport and language-record contract (RT011_2 GREEN), and the operator UT can cover an Org-labelled example in the same pass as condition 1.
