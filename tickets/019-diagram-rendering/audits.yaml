            FINDINGS

            F1 (blocking) - Mermaid strict-configuration decision is unenforced and unverified in the supplied evidence.
            The spec (Decisions; Solution Design/Security) and docs/ARCHITECTURE.md v13 record that Mermaid runs with strict configuration. In the supplied implementation the only carrier of that decision is `--configFile <session>/mermaid.json` in internal/preview/diagram.go, and no supplied code creates or writes that file. If the file is absent, either real mmdc invocations fail and every Mermaid block silently falls back to literal source (the authorized outcome is unmet for Mermaid), or mmdc tolerates the missing file and runs without strict configuration (the recorded security decision is not enforced). Either branch is a concrete correctness or security defect. Compounding this: AC019.2 covers only the PlantUML sandbox, RT019.1 observes the PlantUML `SANDBOX` environment but never the Mermaid invocation's configuration, and the automated GREEN evidence uses captured renderers that ignore the config file, so the real invocation path is unobserved while UT019.1 remains AMBER. This violates the spec's own approved decision and the ARCHITECTURE.md requirement that each important decision have a traced behavioural test or an explicit implementation-review check.
            Required remediation: enforce strict configuration in the delivered code (write the strict config into the owned session, or apply equivalent strict settings to the invocation); trace the decision by extending RT019.1's captured-renderer assertion to the Mermaid invocation's configuration, mirroring the existing PlantUML SANDBOX check; and either extend AC019.2 (or add an AC) to cover Mermaid strictness, or record the implementation-review check in the design. If the config file is written in code outside the supplied manifest, supply that evidence as a challenge; the missing verification trace remains and still requires remediation. Re-run the affected RT afterwards.

            F2 (documentary, required remediation) - Affected documentation is not identified in the handoff.
            DOCUMENTATION.md requires definition to identify affected documentation in the handoff. The spec's Delivery Handoff names only implementation files and evidence links. The documents actually affected and updated in delivery - docs/INSTALLATION.md, docs/READING.md, docs/ARCHITECTURE.md, the executable help text, and packaging/htmlpreview.rb.tmpl - are not named there.
            Required remediation: add the affected-documentation list to the Delivery Handoff section of spec.org. Bounded documentary correction within the existing allowance.

            NOTES (non-blocking)
            - The missing-tools/oversized-source failure path is exercised at the renderDiagram error boundary (oversized Mermaid source rejected) but page-level source retention on renderer failure is asserted only indirectly; the shared error branch in restoreCode covers it. Optional improvement only; not a requirement at this gate.
