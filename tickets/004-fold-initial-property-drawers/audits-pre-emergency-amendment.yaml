          response: |-
            GATE: definition
            REVISION: 6737c7304cd1c483d67784f9d989bae6217f376dbaec55a63c89f08cfc3cbd13
            VERDICT: FAIL

            Findings:

            1. **Marker phase and ownership remain contradictory.** The flow says the pre-pass emits the marker, while the decision and interface say trusted restoration adds it after scrubbing. The supplied final sanitizer also currently omits the marker from its allowed attributes. Define one exact pipeline, including per-drawer placeholder schema, trusted association, final-sanitizer handling, and publication timing. Assert the marker in final HTML, not only an intermediate DOM.

            2. **Repeated startup directives contradict the stated precedence.** The decision says the last `#+STARTUP` directive wins, but RT004.1 says repeated directives select `showall`. Define whether repetition is valid and last-wins, or invalid and fallback-to-`showall`; distinguish repeated valid directives from invalid or multi-value directives, then align the acceptance and RT cases.

            3. **Declared transport failure behaviour is untested.** Missing or duplicate placeholders are required to produce a render error without an owned marker, but no RT or UT exercises either case. Add a bounded automated restoration test with exact status, diagnostic, marker, and output expectations, or remove that failure contract.

            4. **The user-test evidence boundary is still incomplete.** The fixture path is named, but its exact contents and oracle remain distributed across category prose, and the procedure does not require recording browser/OS environment, tested revision, per-mode states, or the exact observed result for each matrix case. Define the fixture and expected state table explicitly and require those evidence fields in `validation.org`.
