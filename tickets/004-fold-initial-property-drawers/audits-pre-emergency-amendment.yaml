      verdict: FAIL
      response: |-
        GATE: definition
        REVISION: 2a5d3b44ddb6743101f10de4597b0d0990d44b96407916404d6bdb179b8f1d7a
        VERDICT: FAIL

        Finding: The transport contract does not define fail-safe behaviour when a drawer placeholder is dropped, duplicated, or altered across Pandoc, scrubbing, and restoration. This can silently lose or mis-associate generated drawer content while RT coverage exercises only valid transport.

        Required remediation: Define the restoration failure outcome and diagnostic, and add a bounded RT/UT case proving that malformed transport cannot publish incomplete or mis-associated drawer output.
      history:
        - round: 1
          revision: 48cebb0fa3c1ccd6b607bf7a343bb23d813736ef0c51c39e6c518ae02235fd9c
          verdict: FAIL
          response: |-
            GATE: definition
            REVISION: 48cebb0fa3c1ccd6b607bf7a343bb23d813736ef0c51c39e6c518ae02235fd9c
            VERDICT: FAIL

            Findings:

            1. **Duplicated audit state.** The specification records a prior “exhausted” audit session and calls the new record “fresh”. Remove this audit-status history from the specification; retain audit state only in `audits.yaml`.

            2. **Startup precedence is contradictory and incomplete.** “Every drawer starts closed” conflicts with the `showall` and `VISIBILITY=all` exceptions, while W001 defines the absent-startup default as `showall`. Define an ordered precedence model covering absent startup, all supported startup modes, every `VISIBILITY` value, nesting, runtime controls, fragments, and print. Amend AC004.1, the design flow, and RT/UT coverage accordingly.

            3. **Unsupported `hidedrawers` and `nohidedrawers` behaviour is undefined.** “Not supported” does not say whether these settings are ignored, diagnosed, preserved as text, or allowed to affect other startup settings. Define their inert behaviour, including multiple settings on one or more `#+STARTUP` lines, and test it. The cited Org authority documents these settings and permits multiple startup settings on a line: [Org in-buffer settings](https://orgmode.org/manual/In_002dbuffer-Settings.html).

            4. **Marker trust and provenance are not implementable as specified.** “A provenance record” has no schema, association, cardinality, collision, mismatch, or post-sanitization binding rule. Define how each generated drawer is bound to exactly one marker, how source-authored marker lookalikes are removed or ignored, and failure behaviour for missing, duplicate, or mis-associated records. Add negative RT assertions for source attributes, classes, duplicate markers, and marker-like drawer content.

            5. **Authored-details, native state, print, and lifecycle preservation are under-specified.** The design claims existing teardown is sufficient, but the supplied browser evidence opens every `details` element during teardown, which can change a source-authored closed detail before bfcache restoration. Specify state ownership and restoration for generated and source-authored details across summary interaction, section/global controls, print, `pagehide`, and `pageshow`; extend UT004.1 to verify each case.

            6. **Fragment compatibility is asserted rather than defined.** “Non-drawer fragments remain unchanged” and “drawer text has no mapping” do not define targets inside source-authored details, generated drawers, or sections containing drawers, nor whether fragment revelation may override authored state. Specify supported and unsupported fragment targets and their precedence, then add corresponding RT/UT cases.

            7. **The RT/UT package is not self-contained enough.** “One fixed fixture”, “provided fixture”, and “existing test command” do not identify a durable fixture, exact input oracle, or complete setup. The RT also uses the vague result “remain intact or pass through sanitization”. Name the fixture or define it completely, provide exact textual assertions, name `make test` explicitly, and split or enumerate the independent browser checks for startup precedence, marker trust, authored state, print, lifecycle, and fragments.
          updated: "2026-09-10T01:52:47Z"
        - round: 2
          revision: b8d9ada6f151e93fe0cb097ffd5506a1830b841a613aebd6f5ed40af12b1931b
          verdict: FAIL
          response: |-
            GATE: definition
            REVISION: b8d9ada6f151e93fe0cb097ffd5506a1830b841a613aebd6f5ed40af12b1931b
            VERDICT: FAIL

            Findings:

            1. **Post-scrub marker placement is architecturally ambiguous.** The design adds `data-hp-org-drawer` after `scrub`, but the current publication path applies a further `sanitizeDocument` pass that does not allow this attribute. Define the exact final publication phase, preserve the marker only as trusted generated metadata, and test it in the published HTML consumed by JavaScript.

            2. **Startup coverage is incomplete despite the defined fallback.** The specification defines absent startup, last-directive-wins, invalid/multiple values, and `hidedrawers`/`nohidedrawers`, but RT004.1 does not explicitly exercise repeated `#+STARTUP` directives or an empty directive. Add those cases and assert the selected `showall` fallback and diagnostic.

            3. **Fragment requirements contradict each other.** The design excludes generated drawer-text destinations, but UT004.1 expects a generated heading/body fragment to open “drawer ancestors”. Specify whether generated drawers can be fragment ancestors. If not, remove that expectation and test only section ancestors; if so, define the mapping and scope it as a requirement.

            4. **Malformed transport behaviour lacks evidence.** Missing or duplicate drawer placeholders are specified as render errors, but neither RT004.1 nor UT004.1 defines a check for those failure paths. Add a bounded automated test at the appropriate transport/restoration boundary, or remove that untested failure contract.

            5. **The browser test is not fully self-contained.** “The provided synthetic Org fixture” has no repository path, exact contents, browser setup, or oracle, and the single user test combines startup, native details, print, fragments, lifecycle, and no-JavaScript checks. Identify the fixture and exact expected states, and enumerate the independent subchecks and evidence to be recorded.
          updated: "2026-09-10T01:56:35Z"
        - round: 3
          revision: 6737c7304cd1c483d67784f9d989bae6217f376dbaec55a63c89f08cfc3cbd13
