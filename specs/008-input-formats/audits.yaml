            **Scope note:** W006 (sha256 5c35141e…, unchanged) was reread only for handoff coherence. Its asset contract, selector grammar, `format_contract:1` and media route still agree with W008's boundary, and W008's new raster table matches W006's signature rules exactly. No W006 verdict is returned and its separate harness problem was not investigated. Neither spec duplicates audit findings, verdicts, revisions, rounds or session identity; `OPERATOR_SIGNOFF: PENDING` and the per-test `RESULT: PENDING` entries are template and validation state, not audit state.

            ## Prior findings, all verified closed

            - **F1 closed.** AC008.1 now excludes native HTML, defines `--from=html` as the passive route and refuses HTML reader extension qualifiers. RT008.2 carries reciprocal coverage of AC008.1 and requires exit 2 for `--from=html+raw_html` with no browser call.
            - **F2 closed.** The operator decision is recorded with its date in Context, Synopsis and both authorities. AC008.14 states graph-on admission, graph-off original-file destinations and unchanged limits; RT008.9 adds five named graph cases with observable results and an explicit case-to-AC mapping; the new file-graph design section names `internal/preview/graph_test.go` and the reference and lifecycle fixtures for reconciliation, and preserves "no numeric default or limit changes". The supplied `graph_test.go:42-66` count, depth and root expectations and `references_test.go:119-129` narrowed-extension expectation confirm the reconciliation targets are real.
            - **F3 closed.** `validation.org` records a bounded 12 September probe: encoder-generated 73-byte PNG in DOCX, ODT and EPUB, owned defaults with `sandbox: true`, isolated empty data directory, an owned Lua filter over `pandoc.mediabag.items()`, identical exported bytes with a recorded SHA-256, plus an honest limit statement and disclosure of the discarded CRC-faulty earlier fixture. AC008.9 and RT008.7 now require a named dependency error before publication with no sandbox-disabled retry, and the design repeats it. The claim is scoped as feasibility evidence, not qualification.
            - **F4 closed.** AC008.6 requires exact displayed characters with only the BOM and newline exceptions and invisible wrapper escapes; RT008.4 compares rendered DOM text independently of the copy payload and asserts no visible escape comma; the new "Display authority" design bullet names the prepass restoration boundary that `internal/preview/org.go` makes necessary.
            - **F5 closed.** The addressable raster-admission contract is now owned by W008, with suffix, MIME and bounded-header signature per type, the 10 MiB ceiling, root and same-filesystem checks, refusal behaviour and an explicit statement that W006's implementation is not a prerequisite. RT008.6 exercises every row with matching, truncated and conflicting headers.
            - **F6 closed.** `validation.org` lists all five UT008.1 requirements with descriptors matching the AC headlines, and the local AC references in Edge Cases now use full descriptors.
            - **F7 closed.** `-f` is refused as an unknown option with exit 2 and is asserted in RT008.2.
            - **Highlighter note closed.** Every non-plaintext code-table identifier was compared against `--list-highlight-languages` with the result recorded, and OT008.1 now requires that comparison per candidate.

            ## Bounded follow-up, reversible and not blocking sign-off

            1. **AC008.9's closing sentence now forbids what the raster contract permits.** AC008.9 states "Temporary paths never become source identity or browser-facing links", while the raster-admission section allows file mode to publish "owned copies within the session directory" as image sources, and every generated page is already a session file URL. The evident intent is that temporary paths must not become source identity or document destinations. Restore that bound to the criterion, or drop the session-copy alternative, so the chosen mechanism is not forbidden by its own AC. Either reading is secure and testable, so this does not reopen an operator decision.
            2. **The "Literal delimiters and encoding" edge case still restates the pre-remediation rule** ("Escape syntax for transport without changing copy text"), which is now narrower than AC008.6's display requirement it links to. Align the wording.

