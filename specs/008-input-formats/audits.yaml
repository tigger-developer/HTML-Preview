      response: |-
        GATE: definition
        REVISION: specs/008-input-formats/spec.org @ sha256 b14af6a313820b1b4a7a6fd13ed1d8c6323cb4729a475111ecf17e5610d36f6a
        VERDICT: FAIL

        **Scope note:** W006 (sha256 5c35141e…) was inspected for handoff coherence only. Its selector grammar, `format_contract:1`, media route, asset allowlist and dependency direction agree with W008's stated boundary; no W006 verdict is returned. No audit state is duplicated in either spec, so the duplication rule is not triggered.

        ## Findings requiring remediation

        **F1. AC008.1 contradicts the native HTML route and its own test.**
        AC008.1 requires that for *every* built-in reader reported by the installed Pandoc an explicit input "produces a preview using that reader's supported content model". The design states that native `html` selects the passive route "because no Pandoc HTML reader is invoked", and RT008.1 exempts it ("Native HTML follows its special route"). The criterion is therefore false for a reader the spec itself expects to appear in the reported list.
        *Required:* bound AC008.1 to exclude the natively handled HTML route, and state in the criterion (not only in design prose) what `--from=html` produces and that its extension qualifiers are refused.

        **F2. File-mode linked-target admission is undefined although the change necessarily broadens it.**
        `supported()` at `internal/preview/source.go:23` gates both explicit admission and graph traversal at `internal/preview/links.go:29-30`. Broadening admission mechanically broadens `HTMLPREVIEW_LINKS=1` traversal, yet no AC or test states whether a linked `.docx`, `.go`, `.json` or `.html` target becomes a converted graph node or remains an original-file link in file mode. RT008.9 asserts that "the shared format resolver independently classifies each linked target" without an observable file-mode expectation, and the passive HTML section covers only HTML-authored references. AC008.11 simultaneously claims existing presentation, navigation and lifetimes "remain intact".
        *Required:* an operator-level decision recorded as a criterion: which newly supported kinds are admitted as file-mode graph nodes, which remain original-file references, and how depth, count and byte budgets apply to them. Add the corresponding expectation to RT008.9 and reconcile the existing graph regressions explicitly.

        **F3. Sandbox retention and container media extraction are asserted together without evidence or a fallback.**
        AC008.9 requires embedded raster media to survive binary/container conversion. AC008.10 and the design require `--sandbox` to stay enabled with "never retry without the sandbox", while the media mechanism is described only as "an owned bounded media-bag export" that deliberately avoids `--extract-media`. Unlike the spec's other dependency facts (reader list, JSON AST failure, Org comma behaviour), this combination carries no recorded probe, and no behaviour is defined if extraction is unavailable under the sandbox. A delivery agent meeting that case must either breach AC008.10 or silently drop media.
        *Required:* record the definition probe establishing extraction under the enabled sandbox with the owned defaults and data directory, or define the required outcome when it is unavailable (visible omission notice, conversion error, or explicit dependency error), so AC008.9 and AC008.10 cannot conflict. Add the chosen outcome to RT008.7.

        **F4. Escaped delimiter lines have no defined displayed text, which is the operator's stated requirement.**
        The wrapper contract requires comma escaping "where required" and guarantees only that escaping occurs "without changing copy text"; AC008.6 and RT008.4 constrain the copy payload and line-ending display, not the rendered characters of an escaped line. Current evidence shows the escape would reach display: the Org prepass terminates a source block on a trimmed `#+END_SRC` and copies each intervening line verbatim into the transported literal (`internal/preview/org.go:88-119`), and `restoreCode` then reinstates that transported text (`internal/preview/transport.go:206-218`). A conforming implementation could therefore render `,#+END_SRC`, defeating the accepted decision to protect literal `END_SRC`.
        *Required:* state in AC008.6 that the rendered code block displays each original line exactly, escaping included or removed invisibly, and add that observable expectation to RT008.4 alongside the existing copy-payload comparison.

        **F5. Native HTML raster admission is delegated to an unapproved, undelivered specification.**
        The passive HTML resources contract admits local rasters "using W006's matching format/signature rules", and the CSP bullet defers image sources to "transport-authorized" sources. W008 is required to deliver independently in file mode, and W006 is itself pending renewed sign-off with its implementation held.
        *Required:* W008 owns the format boundary, so state the admitted raster types and the signature rule it applies in file mode (or bind it explicitly to the existing file-mode image policy), leaving only the HTTP-specific headers and routes to W006.

        **F6. Test-definition traceability drifts between the spec and validation.org.**
        `validation.org` records UT008.1 as proving only AC008.13, whereas the spec's UT008.1 covers AC008.6, AC008.7, AC008.8, AC008.11 and AC008.13, and it names AC008.13 with a different descriptor ("Installed portability and guidance" against "Installed use remains portable and documented"). UT008.1's own "Covers" list also uses shortened descriptors that do not match the AC headlines.
        *Required:* align the descriptors and the recorded requirement coverage in both files, so the planned qualification record matches the definition.

        **F7. Documentary correction.** "No `-f` alias is required" is not a falsifiable interface statement. State whether `-f` is accepted or refused, given that the current parser rejects unknown options (`internal/preview/config.go:31-36`).

        ## Bounded item that would not, alone, have blocked sign-off

        - The common code table asserts 60-odd "Pandoc highlighting identifiers" with no probe and no check against `pandoc --list-highlight-languages`; OT008.1 reviews mappings but compares only against `--list-input-formats`. The defined literal-text fallback and RT008.3's unavailable-language probe make this reversible. Extending OT008.1's comparison to the installed highlighter catalogue would close it.

        ## Assessed as sound

        - Reciprocal AC to test tracing is complete in the spec: all thirteen ACs name a test, and every RT, UT and OT names the ACs it covers.
        - Classification and TDD suitability are honest: nine persistent RTs with intended RED statements and real Pandoc, one operator UT with a platform matrix, one bounded OT with invocation limits and no metered dependency. No test relies on source-text greps.
        - Detection precedence, compound-suffix handling, the `CMakeLists.txt` exception, exit-status split (2 for invocation, 1 per source) and the JSON token-preserving contract are deterministic and falsifiable, and the exit statuses agree with the documented interface in `README.md`.
        - Security impact, resource bounds, archive limits and the "no insecure fallback" rule are present and specific, and the W006 handoff, dependency direction and W007 annotation exclusion are stated consistently across the two active drafts, `docs/work.org`, `docs/VISION.md` and `docs/ARCHITECTURE.md`.
