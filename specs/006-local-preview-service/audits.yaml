        - Scope and over-engineering: no component or mechanism was added to fill template sections. Every schema-5 subsection maps to an existing approved decision. The intended-RED passages correctly describe the original baseline, as the audit context directs; the existing implementation and validation checkpoints are baseline evidence only.
