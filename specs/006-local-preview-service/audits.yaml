            FINDINGS:
            - The specification duplicates workflow status with `#+DEFINITION_GATE: PENDING` and `#+OPERATOR_SIGNOFF: PENDING`. Remove both fields and any duplicate audit status, revision, round, or session data; retain lifecycle state in `docs/work.org` and audit state only in `audits.yaml`.
            - Traceability is incomplete: `UT006.1` covers requested lazy rendering but is absent from AC006.5; `OT006.2` claims AC006.2, AC006.12, and AC006.13 but those criteria do not link it. Correct the reverse mappings, or remove claims that documentation review proves runtime behaviour.
            - Several acceptance criteria combine independently falsifiable outcomes, especially AC006.2, AC006.3, AC006.4, AC006.8, AC006.9, AC006.10, AC006.11, AC006.12, and AC006.13. Split them and trace each independent condition to explicit evidence.
            - AC006.2 promises fallback for sources outside configured roots, while the design preserves `HTMLPREVIEW_ROOT`’s existing explicit-input rejection. Define the distinction and precedence between service-root exclusion and client-root narrowing, then align acceptance criteria, edge cases, and tests.
            - “Approved raster type/signature” and “permitted linked files” are not defined precisely enough for implementation or security testing. Specify the allowlist, signature/content-type rules, registration boundary, disposition, and mismatch outcomes.
            - RT006.7 relies on vague “shared rendering assertions”, and the HTTP test definitions do not explicitly cover `HEAD`, `/_health`, reserved `/_org`/`_file` routes, or route-collision behaviour. Name the exact inherited W001–W005 invariants and add these HTTP boundary cases.
            - RT006.3 treats generator review as test evidence for token entropy without defining observable wire assertions. Test token encoding and length at the HTTP boundary; reserve `crypto/rand` implementation review for the implementation audit. Define intended RED evidence for every persistent RT, including RT006.10.
            - RT006.10 refers to “supplied” plist, unit, and YAML artefacts without naming their paths, installation locations, or exact service-manager contracts. Enumerate those artefacts and their packaging, activation, preservation, and rollback expectations in the handoff and corresponding tests.
