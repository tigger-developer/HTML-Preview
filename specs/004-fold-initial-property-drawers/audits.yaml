            FINDINGS:

            1. `internal/preview/org.go:62-77` promotes `#+TITLE`, `#+SUBTITLE`, `#+AUTHOR`, and `#+DATE` wherever they occur, including after body content. This violates the leading-field boundary. Remediation: gate title-field capture on `frontmatter` and add a body-before-keyword regression.

            2. `assets/web/page.html:13,19` emits two semantic H1 elements on titled Org pages. This violates the inherited one-source-identity-H1 contract and the selected web standard. Remediation: retain exactly one semantic H1, keep the filename as non-outline source identity, and update `TestRT004_2_OrgFrontmatterHeadings`.

            3. `assets/web/preview.css:53` removes the toolbar buttons’ borders, so the required coloured outline controls are rendered as filled controls. Remediation: restore a visible outline while retaining distinct accessible colours, then recheck both themes.

            4. `internal/preview/presentation_test.go:15-24` counts metadata labels but never asserts their names. A regression could lose or corrupt field names while passing. Remediation: assert the exact ordered label and value pairs, including repeated and unknown fields.

            5. The added or expanded automated cases have no demonstrated intended RED evidence. `validation.org:22-26` records GREEN for the new drawer matrix, while `graph_test.go:207-274` adds it; the expanded single-field cases at `graph_test.go:151-177` likewise have no RED record. The validation record also contains no completed current full-suite result. Remediation: rerun the affected tests and complete `make test` after remediation, recording distinct RED/GREEN and full-suite evidence.
