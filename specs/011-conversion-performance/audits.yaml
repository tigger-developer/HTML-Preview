            ## Summary

            - **Strong package overall**: routing, footnote-normalization, worker-protocol and trust-boundary cases are behavioural, use the real CLI/HTTP/subprocess boundaries, assert relationships rather than ID spellings or serialized HTML, and are retained under `make test` (`go test -race ./...`).
            - **Scaffolding is acceptable**: `internal/orgconvert/worker.go` declares only the request record and an always-failing `Worker`; no production code imports it, and `cmd/htmlpreview` still has no `--internal-org-convert` dispatcher, so `TestRT011_1_PackagedNativeWorker` is genuine RED at the production boundary, not a setup failure.
            - **Initially GREEN preservation is justified** and matches the maintained pack (RT002.1/RT002.3/RT004.3/RT005.2, checkbox, block-placement and W009 footnote tests).
            - **FAIL cause**: three cases named in the signed-off definitions are not covered by meaningful assertions.

            ## Blocking findings

            **F1 — RT011.7 "cancelled/hung worker" has no behavioural coverage** (`internal/preview/native_org_test.go`, `internal/orgconvert/worker_test.go:138`)

            - **Evidence**: `TestRT011_7_WorkerCancelled` passes an already-cancelled context to `exec.CommandContext(...).Run()`. `os/exec.Start` returns `ctx.Err()` before the child starts when the context is already done, so `err != nil` and `len(out) == 0` hold for *any* implementation, including the present always-failing scaffold and a future correct worker. Independently of that stdlib detail, the test drives `exec` directly, so the parent's `runProcess` kill/reap, slot release and temporary-state cleanup are never observed.
            - **Also missing**: no case where the worker starts and blocks. `TestRT011_7_NativeWorkerFailureAndRecovery` only forces an immediate `Execute` error (422 + recovery). The existing Org stall/flood coverage (`TestRT002_2_PassiveHighlighting`, `PREVIEW_TEST_FAULT=converter-stall`/`converter-flood` on `dense.org`) is keyed on `filepath.Base(cmd.Path) == "pandoc"` and stops exercising Org once routing is native, so deadline/timeout classification (504) and output-flood bounds lose their Org coverage rather than gaining native equivalents.
            - **Remediation**: add a native case that starts a real blocked/flooding worker through the existing controllable `Host` boundary (the RT011.7 method), asserting: bounded failure with no partial page, the existing timeout/limit status classification, the child reaped, and a subsequent valid request serviceable. Retain or re-key the `dense.org` stall/flood expectations to the native path.

            **F2 — RT011.7 "controlled low memory threshold" is indistinguishable from request rejection** (`internal/orgconvert/worker_test.go:112`)

            - **Evidence**: the only memory cases are `memory-ceiling` (513 MiB, correctly rejected as above the application maximum) and `memory-limit` (`MemoryBytes = 1`), both placed in the invalid-request table asserting the same generic "error, no output" as `{`, trailing data and unknown fields. An implementation that validates `MemoryBytes` against a floor at parse time satisfies the test while the design's runtime memory monitor and abort path (spec `#worker-contract`, "Verify its failure path") get no coverage at all.
            - **Remediation**: one dedicated case with a *valid but lowered* private bound and an input large enough to exceed it, asserting the bounded limit-classified failure with no partial output — and, as a control, that the same input converts under the ordinary bound. Keep allocations small, per the spec's "do not allocate hundreds of MiB" bound.

            **F3 — RT011.5 converter-delta integration case is absent**

            - **Definition**: "Use the named footnote fixture from RT011.2 through the real service. Verify that identification, edit and delete address the intended note after normalization, including repeated references and a multi-paragraph definition. Correct-looking HTML alone does not establish a working annotation association."
            - **Evidence**: no such test exists in the delta. The maintained tests cover the two halves separately and never together: `TestRT009_7_EditOrdinaryFootnotes` uses repeated references with a **single-paragraph** definition (`[fn:12] *Original* note.`); `TestRT009_7_HTTPCurrentFootnotes` edits **application-authored** multi-paragraph notes; `TestHTTPDeleteFootnote` deletes a single-paragraph note; `TestRT009_8_EditableNotesPreserveRenderedMarkup` checks rendering only. `TestRT011_2_FootnoteHTMLContract` asserts published HTML through the CLI, which the definition explicitly says is not sufficient.
            - **Remediation**: one service test using the RT011.2 fixture (repeated references plus the two-paragraph definition) that lists the note, edits it, deletes it, and verifies the intended source bytes change with unrelated bytes preserved.

            ## Additional items to correct in the same round

            - **RT011.7 input allowance**: the exact/over pair is asserted for output only (`worker_test.go:68-77`). The definition names "maximum **and** excess admitted source/intermediary bytes"; `input-limit` tests only the excess side. Add the exact-maximum acceptance case.
            - **RT011.1 native content assertion** (`internal/preview/native_org_test.go:33`): the compound condition exempts `source.org` and `source.data` from any content check, so the two primary native cases assert only exit status and page count. Assert the published heading/body text for them (the linked-page and RT011.2 tests cover content elsewhere, but the routing table's own "publish readable pages" expectation is unasserted).
            - **RT011.2 evidence attribution**: the named checkbox delta case (`X`/`x` equivalent checked, space unchecked, `/` partial, label spacing, whole-item structure) is in fact covered by `TestCheckboxRendering` and the checkbox rows of `TestHTTPBlockAnnotations`, but `validation.org` records neither under RT011.2's command selection or `:EVIDENCE:`. Cite them so the named case is traceable to executed evidence.

            ## Explicitly not findings

            - Invalid-request controls passing trivially while the scaffold rejects everything is correctly disclosed in `validation.org` and paired with RED valid controls (`WorkerRoundTripAndBounds`, `OwnedLiteralRecords`, `ConcurrentWorkers`).
            - The 503→422 classification correction is consistent with the renderer's existing generic conversion-failure mapping and was rerun independently; no scope change.
            - `PREVIEW_TEST_FAULT=reject-pandoc-org` lives in the test binary's `TestMain` Host wrapper, not production — no test-only production hook is introduced.
            - Recording the executed revision as "64b4b81 plus W011 test package and worker scaffold" is honest for a pre-commit run; no correction required.
