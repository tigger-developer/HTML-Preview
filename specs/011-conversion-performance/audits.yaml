            ## Mandatory-fail checks (all clear)

            - **No annotation records or blocks** in `spec.org`: only `PROPERTIES`/`CUSTOM_ID` drawers and ordinary Org prose. No `feedback.yaml` was supplied and nothing indicates processed-then-removed feedback.
            - **No duplicated audit state**: no findings, verdicts, revisions, round numbers or session IDs in `spec.org`, `assessment.org` or the W011 ledger entry. Handoff only *links* `audits.yaml`, as the template requires.
            - **Schema 8 conformance**: eight Synopsis categories in order, fixed level-one sections, every AC tagged `:ac:`, every test tagged `:testdef:`, unique IDs, and every internal link resolves to an existing `CUSTOM_ID`.

            ## Traceability and test definitions

            - **Complete both ways**: AC011.1–9 each name ≥1 test; RT011.1–7, OT011.1–2 and UT011.1–2 each cover ≥1 AC.
            - **Classification is honest**: RTs are persistent `make test` work; OT011.1 (benchmark) and OT011.2 (packaging/`vulncheck`) are correctly one-off and explicitly out of CI; UTs are human browser judgement.
            - **AC011.8 with no RT is justified** — a bounded same-machine comparison with a stated numeric target and an explicit "not a timing assertion in CI". No artificial RT is warranted.
            - **TDD position is correct**: new native-routing RED plus recorded initially-GREEN preservation checks, per TESTING.md.
            - **Observability confirmed against code**: `restoreTransport`, `runProcess` cancellation/reaping, the substitutable `Host` executor, `MarkBlocks` candidate map and `fidelity.lua` record formats all support the stated boundaries.

            ## Design, scope and proportionality

            - **Within the authorized change.** Excluded work (source offsets, pass reduction, Markdown replacement, annotation redesign) appears nowhere. The worker subprocess (go-org has no cancellation API) and the Chroma highlighter (Pandoc no longer converts Org; per-block Pandoc calls rejected) are consequences of the approved replacement, not template inflation.
            - **Baseline claims verified**: `render.go:125` carries `+RTS -M512M -RTS`; W006's bounded-state contract states two concurrent conversions, a 60-second deadline and 10 MiB source. W011 declares the Org-only supersession of the Pandoc heap mechanism and retains process isolation, byte ceilings and killable deadlines. No signed-off W006/W009 AC is violated — W009's footnote ACs are behavioural, not Pandoc-mechanism-bound.
            - **Memory boundary is stated honestly** as a Go-accounted target, not a hard RSS cap.

            ## Conditions (bounded, reversible; none invalidates sign-off)

            - **C1 — worker resolution under the traced regressions.** The contract fixes invocation to `--internal-org-convert` "resolved through `os.Executable`", while RT011.4/RT011.5 extend the existing in-process service tests (`internal/preview/annotation_blocks_test.go:15`, `startTestService(t, NativeHost())`) and RT011.7 demands real worker subprocesses with "no production-only test endpoint". Under `go test`, `os.Executable` is the package test binary. State the mechanism by which package tests obtain a worker-capable executable, and that it cannot widen production executable resolution (TESTING.md treats harness additions as architectural; CODING.md requires justification for test-only production interfaces).
            - **C2 — advisory coverage of the replaced parser.** The maintenance bullet requires pinning, notices and a recorded delta, and OT011.2 expects `make vulncheck` to succeed, but nothing states how upstream go-org advisories are tracked once the module is replaced by `third_party/go-org` — module replacement can remove the version identity the gate matches on. Record the tracking mechanism and add it to OT011.2's expected evidence (SECURITY.md requires complete coverage of dependency sets affecting the artefact). The patch itself is justified and is not in question.
            - **C3 — Synopsis omits a material decision.** Adoption of the native Chroma highlighter, with its licence, notices and vulnerability obligations, appears only in the design. ISSUES.md requires the Synopsis to omit no material change or decision; add one bullet naming it and its no-new-installed-runtime boundary.

            ## Observations (no action required)

            - "Preserve current 10 MiB source, service output and session budgets" reads ambiguously; W006 sets 10 MiB source and 50 MiB output per conversion.
            - The memory target and abort threshold are the same 512 MiB value; an explicit revisit trigger for that accepted compromise would satisfy ARCHITECTURE.md's compromise rule more fully.
            - OT011.1 depends on the private corpus. An unavailable corpus leaves AC011.8 unproven and OT011.1 AMBER, which blocks delivery-code readiness. The spec correctly refuses to claim a substitute proves the target.

            ## Evidence coverage

            Read in full: the W011 `spec.org` and `assessment.org`; SDLC `ARCHITECTURE.md`, `AUDITS.md`, `CODING.md`, `DOCUMENTATION.md`, `ISSUES.md`, `ORG-SCHEMA.md`, `ORGMODE.md`, `SECURITY.md`, `TESTING.md`, `technologies/GO.md`, `templates/v3/spec.org`; `project.yaml`; `docs/work.org`; `fidelity.lua`; `go.mod`; `render.go`, `process.go`, `transport.go`, `org.go`, `service_render.go`, `service_footnotes.go`, `annotation_blocks.go`, `annotation_blocks_test.go`, `internal/annotation/blocks.go`; W006 `spec.org`.

