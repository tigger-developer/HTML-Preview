            ## Conditions (bounded, reversible; no code or design change)

            **C1 — RT/OT execution currency is not established for the audited revision in `specs/011-conversion-performance/validation.org`.** Every W011 RT record names a 20 September revision (`e171898`, `342fa00`, `216bee6`, `de0cb56`, corpus checkpoint). Since then, code those RTs exercise has changed: the worker protocol, bounds and memory supervision moved to `internal/convertworker/worker.go` with `internal/orgconvert/worker.go` reduced to aliases (699 bytes); highlighting moved to `internal/converthtml`; `render.go` dispatch was rewritten around `convertNative`; and `internal/annotation/blocks.go` (8,173 bytes) carries later target changes. The W011 test code itself changed — `internal/preview/native_org_test.go` now parameterizes `testStartedNativeWorkerBounds(t, format)` and records a W014 expectation in `TestRT011_1_ServedOrgAndMarkdown` — and no W011 record cites an execution of that text. TESTING.md requires affected reruns before the delivery-code audit; the reconciliation note's "no code changed in this reconciliation" is honest but covers only the documentation change. Required correction: in `validation.org`, either cite the existing executions that already cover the current code (W014's `75c13b0` full `go test -race -timeout=20m ./...` inventory with its named remediation reruns, its `TestRT011_7_StartedNative|TestRT011_1_ServedOrgAndMarkdown` selector, and the W013 reruns of the block-placement pack), or record one affected-selector rerun at the closure candidate. RT011.4 needs explicit coverage because `internal/annotation/blocks.go` changed after its recorded revision. No new automation is required; OT011.2 packaging is already covered by W014's `75c13b0` archive/licence/vulnerability run, and OT011.1's ratio is not invalidated by a package-move refactor — say so rather than repeating the 108-operation benchmark.

            **C2 — False converter attribution in comments on W011-owned components.** CODING.md requires correcting a comment that behaviour has falsified. Org conversion is native, and annotation writes exist only for Org and Markdown, both native; these passages now misdirect a maintainer:

            - `internal/preview/org.go:1` — "Preserves Org values that the Pandoc reader discards."
            - `internal/preview/service_footnotes.go:1` — "Renders sidecar and legacy notes through the existing Pandoc pipeline."
            - `internal/preview/service_footnotes.go:164` — "Restore Pandoc's usual backlink at the end of the preceding paragraph", where `orgconvert.footnoteBacklink` now emits it.
            - `internal/annotation/blocks.go:2` — "Pandoc output must verify each candidate before it becomes an interactive block."
            - `internal/annotation/preview.go:19` and `:94` — "Pandoc renders ordinary and virtual notes together" and "makes Pandoc emit an otherwise unreferenced definition."

            Required correction: name the selected converter or the conversion pass, not Pandoc. Comment text only.

            **C3 — UT011.1 omits the viewing conditions its own definition requires.** The signed-off Record clause is "Date, candidate revision, browser/viewport and observations"; the record supplies date, evidence and an explicit disclosure that the exact executable revision was not supplied, but says nothing about browser or viewport. TESTING.md's paired ledger lists the same field. Required correction: add the disclosure, following the precedent already used in `specs/014-native-markdown/validation.org` ("Browser and viewport details were not supplied; no automated visual result is implied"), to UT011.1 and UT011.2. This is a record edit; no retest is requested and none is implied.

            ## Verified

            **Design conformance.** `render.go:131` dispatches `format == "org"` to `convertNative` and leaves non-native readers on Pandoc; no Org fallback exists. `convertNative` resolves the worker with `os.Executable`, sends one bounded JSON request on stdin with no path argument, counts protocol overhead once against the session allowance, and maps `convertworker.LimitExit` to a resource-limit error. `cmd/htmlpreview/main.go:19` dispatches `--internal-org-convert` before CLI, config and service startup, and `preview_test.go:40` reuses the same entry function in `TestMain`, so no test-only production interface exists. The shared-worker extraction preserves the approved contract: version, 32-hex token, TOC depth 1–6, positive allowances within 100/50/512 MiB, exact request-size limit, UTF-8 validity, duplicate-key and trailing-data rejection, unique probe labels, a 10 ms runtime-accounting monitor with fixed content-free diagnostics, and one process per conversion.

            **Adapter and patch boundary.** `orgconvert/convert.go` denies `ReadFile`, discards library logging, leaves includes unexpanded, sets `MaxScanTokenSize` from the already bounded input, and owns export settings and TODO partitions rather than go-org defaults. It emits the approved anchor/`section.footnotes`/`ol`/`li` structure with `doc-noteref` and `doc-backlink`, owned heading/code/TOC records, checkbox variants, path-free heading searches (`render.go:352` keeps the raw source spelling alongside rendered text under normal ambiguity checks) and literal records rejected unless the Chroma token concatenation equals the stored text (`converthtml/highlight.go:37`). Unresolved authored references fall back to literal text with the empty endnotes section removed. The local parser diff remains `document.go` and `list.go`, documented with reproducers in `third_party/go-org/README.md`; `provenance.json`, `go.mod` and the notices agree on `v1.9.1` at `2f088a1`.

            **Later corrections.** `nativeReferences` (`internal/annotation/native_attribution.go:162`) now clears the container state for every Org block except `SRC`, `EXAMPLE`, `COMMENT` and `EXPORT`, so a reference inside a rendered quote counts as placed, including a source block nested in a quote; `TestHTTPQuotedFootnotes` asserts one rendered entry and exactly one backlink per label, no "Unplaced annotation" text, and exact source bytes after deleting one of two notes. `emptyOrgDescription` (`internal/annotation/blocks.go:12`) withholds only the probe at an empty `::` delimiter; `TestHTTPAnnotationTargetContract` mirrors the browser's container precedence and excluded-ancestor rules, requires the nearest eligible block to carry its own verified ID, then creates a note through that target and re-reads the advertised refresh URL.

            **Trust boundary.** `TestRT011_6_NativeOrgCannotFetchOrExecute` drives INCLUDE, SETUPFILE, remote image, export-block script/form and `javascript:` URL through the real CLI, asserting zero listener calls, no canary text, no script/form/input nodes and no source text in stderr. The token is unpredictable and verified absent from source before use, so owned records cannot be forged from authored HTML; `#nosec` suppressions name their rule with an adjacent justification.

            **Documentation.** README (v5), Vision (v5), Architecture (v8), ANNOTATIONS (v8), FORMATS, SERVICE, notices and `docs/htmlpreview-help.txt` describe the delivered behaviour: native Org and Markdown, optional Pandoc, the 512 MiB soft Go-runtime target stated as not an RSS ceiling, the dual vulnerability scan, and the retained superseded-converter history labelled as history. The reconciliation records the outcome as updated or not affected with reasons. Checked link targets exist (`docs/ORG-FIDELITY-REVIEW.md`, W001/W002 `audits.org`, `assets/licenses/goldmark-LICENSE`, `third_party/go-org/README.md`). No audit findings, verdicts, rounds or session identifiers appear in `spec.org`, `validation.org` or `docs/work.org`; they link `audits.yaml` only. I considered the ledger's "Closure dependency: external harness recovery requires operator authorization" against the no-duplication rule and do not treat it as duplicated audit state: the ledger vocabulary requires a BLOCKED item to name its external dependency, and the bullet names no verdict, round, revision or session.

