            ## Delta assessed

            **Production (9 lines, `internal/annotation/blocks.go`).** `emptyOrgDescription` (anchored: optional indent, `-`/`+`/`*` or `N.`/`N)` bullet, whitespace, ` ::` and end of line) plus a skip guarded by `format == "org" && !heading`. It only *withholds* a probe candidate at an empty description delimiter; it adds no target, and the renderer's verification, shape/revision correspondence and write-time checks are untouched. This is the correct minimal fix: the marker previously turned `- Details ::` into ordinary list text, so the section's rendered structure no longer corresponded to the unmarked render and every block in it lost its target. Narrowness is pinned by the fixture's `Ordinary prose ending with ::` case, which has no bullet, keeps its probe and is asserted clickable.

            **Tests.** `TestHTTPAnnotationTargetContract` serves both fixtures through the real service, parses the bootstrap metadata, checks `writable` state and revision agreement with the write endpoint, starts from visible text, and requires the *nearest* eligible block to carry its own verified ID. I checked the mirror against the browser code: container precedence (`table`/`blockquote`/`div` with the attribute) and the fallback list match `annotationBlockFor` (`assets/web/annotations.js:193`); the excluded-ancestor set matches the click handler's `a,button,summary,.todo,.done,.tag,.priority,.cookie,.footnotes` (`:155`); and rejecting an `<a>` without `href` is correct because the plain handler bails on any `closest('a')` while `guardNavigation` (`:219`) requires `a[href]`. The test then creates a note through the selected target, refreshes via the advertised `page_url`, and confirms the note and retained targets. Fixtures are synthetic with no private content; their README states the HTTP/HTML scope, the no-browser limit and the pre-existing Markdown colon-description exclusion without promising new capability.

            **Evidence.** RED reproduced on six elements around nested descriptions before the correction, GREEN after; focused, affected (111.816 s pack, with the exploratory heading fixture replaced by an ordinary heading) and final contract-only (9.288 s) race runs recorded, plus `internal/annotation` at 5.179 s. RT011.1–011.7 and OT011.1–011.2 carry current GREEN with revisions and commands; unaffected earlier evidence is retained under the affected-rerun rule. UT011.1 and UT011.2 remain explicitly AMBER, UT011.2 with a dated user-validation observation, candidate revision and the retest requirement — recorded as status, date, revision and outcome, with no personal attribution.

            **Documentation.** The previous provisional conditions are applied: `spec.org` now reads "Agent-authored verification estimates may be amended during hands-off delivery…" and `validation.org` "The verification estimate was amended to allow necessary replacement measurements after remediation." No audit findings, verdicts, rounds or session identifiers appear in `spec.org`, `validation.org`, `work.org` or the new fixture README; the spec links to `audits.yaml` only. No product documentation is made stale by this delta — behaviour is restored to what the architecture and annotation guide already describe — and the new README carries required frontmatter and impersonal voice.

            **Scope.** No new dependencies, runtime, packaging or architecture; no browser harness; no relaxation of the source proof; private corpus material stays outside the repository and outside this review.

            ## Withdrawn

            My earlier non-blocking observation that repeated references duplicate the endnote definition "where Pandoc produced a single definition with two backlinks" is withdrawn. The recorded direct `org`→`html5` Pandoc probe of two references to one named two-paragraph note emits two numbered definitions with separate reference/backlink pairs, so the adapter retains baseline reader behaviour. My statement was inferred from the specification's single-reference example rather than a probe.

            ## Non-blocking observations

            - The Go mirror of the browser selectors can drift if `annotationBlockFor` or the click filters change; naming that function in the test comment would tie them together.
            - The mirror's fallback list omits `[role=heading]`, which `annotationBlockFor` accepts for headings deeper than level six. No current fixture reaches that depth, so nothing passes falsely today.
            - Closure still requires the operator's UT011.2 retest and UT011.1; HTTP and parsed-HTML assertions do not establish click handling or layout, and no Linux/WSL runtime claim is made.
