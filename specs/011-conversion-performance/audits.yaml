            VERDICT: PROVISIONAL PASS

            ## Conditions (bounded, reversible; no code or design change)

            **C1 — Operator-agent narration in `specs/011-conversion-performance/spec.org`.** The hands-off decision log's "Verification allowance clarification" opens "The operator clarified that agent-authored verification estimates may be amended during hands-off delivery." DOCUMENTATION.md requires decision logs to record the decision, rationale and consequences, not conversational history, and prohibits paraphrasing operator-agent permissions. Required correction: state the decision impersonally, for example "Agent-authored verification estimates are routine and may be amended during hands-off delivery. The 108-operation estimate counts one complete comparison and does not prohibit justified replacement samples after remediation." Keep the remaining sentences unchanged.

            **C2 — Same narration in `specs/011-conversion-performance/validation.org`.** The "Benchmark checkpoint" Progress bullet states "The operator clarified that routine verification estimates may be amended during hands-off delivery." Required correction: record the amended allowance and its consequence factually (for example "The estimate was amended; the remaining 33 measurements then ran, giving 108 retained final operations and 33 preliminary or interrupted operations"), without describing the exchange. The AMBER-to-GREEN history and operation counts stay.

            Neither condition affects code, tests, evidence validity or the recorded results.

            ## Verified

            **Design conformance.** `render.go:132` dispatches Org and Org wrappers to `convertOrg` and leaves every other reader on Pandoc; the existing preservation, transport restoration, catalogue, checkbox decoration and contents restoration pipeline is unchanged. `convertOrg` resolves the worker through `os.Executable`, sends one bounded JSON request on stdin with no path argument, counts protocol overhead against the session allowance, and maps `LimitExit` to a resource-limit error. `cmd/htmlpreview/main.go:15` dispatches the private mode before CLI, config and service startup. No Pandoc fallback for Org exists.

            **Worker contract.** `worker.go` enforces version, 32-hex token, TOC depth 1–6, positive allowances within 100 MiB/50 MiB/512 MiB ceilings, exact request-size limit, UTF-8 validity, duplicate-key and trailing-data rejection, and probe-label syntax and uniqueness. The 10 ms monitor over Go runtime accounting aborts above the requested ceiling; diagnostics are fixed strings, never source text or the token. Parser `ReadFile` is denied, library logging discarded, includes unexpanded.

            **Adapter and patch boundary.** `convert.go`/`contents.go` emit the approved anchor/`section.footnotes`/`ol`/`li` structure with `doc-noteref` and `doc-backlink`, owned heading/code/TOC transport records, declared TODO partitions, checkbox variants and path-free heading searches resolved by the existing catalogue (`render.go:333`, `links.go:151`). Chroma output is rejected unless token concatenation equals the literal record, falling back to escaped plaintext. The local parser diff is confined to `document.go` (scanner allowance) and `list.go` (numeric-marker grammar, descriptive/ordinary list boundary), documented in `third_party/go-org/README.md` with synthetic reproducers in `native_org_corpus_test.go`; no source offsets, proof relaxation or input rewriting.

            **Tests and evidence.** The admitted bb7923b package is intact; added coverage (corpus list semantics, local heading searches, three placement rows, footnote-embedded `SRC` block) asserts published HTML and exact source bytes through the real CLI and service. RT011.1–011.7 are GREEN with recorded commands, revisions and affected-race reruns; OT011.1 aggregate shows 18 rows × warm-up plus five samples = 108 retained operations, alternating build order, per-run source-preservation checks, and GET medians of 8.36%, 8.48% and 10.32% of baseline; OT011.2 shows four archives, byte-identical licences, isolated symlink trial without Go/Rust on PATH, and both vulnerability scans clean. UT011.1/UT011.2 correctly remain AMBER; no browser or Linux/WSL claim is made.

            **Records.** No audit findings, verdicts, rounds or session identifiers appear in `spec.org`, `validation.org` or `work.org`; they link to `audits.yaml` only.

            **Documentation.** README, Vision, Architecture and notices describe the delivered converter accurately and impersonally, including the memory target being a soft Go-runtime bound rather than an RSS ceiling, the retained Pandoc dependency, and the dual vulnerability scan.

            ## Non-blocking observations

            - Repeated references to one named note emit one endnote definition per reference (`convert.go` `After`), so a twice-referenced note appears twice in the endnotes, where Pandoc produced a single definition with two backlinks. The approved contract and RT011.2 case require unique IDs and correct per-reference destinations, which this satisfies, but it is a reader-visible difference worth putting in front of UT011.1/UT011.2.
            - Full-suite race evidence is at 216bee6 with targeted reruns after the `de0cb56` spacing correction and the `e171898` corpus corrections. The selection covers the Org list, checkbox, placement, footnote-markup and heading paths the changes touch, which satisfies TESTING.md's affected-rerun rule; a final `make test` before closure would remove the composition argument entirely.
            - `footnote_service_test.go` now has two `t.Run("org", …)` subtests writing the same `markup.org` fixture; they are sequential and independent, but distinct subtest names would make a failure easier to attribute.
