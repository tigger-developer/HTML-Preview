            ## Prior findings — all resolved

            **F1 (cancelled/hung worker) — resolved.** `TestRT011_7_StartedNativeWorkerBounds` (`internal/preview/native_org_test.go:237`) substitutes the real `--process-blocker`/`--process-flood` children **only at the native `--internal-org-convert` Host invocation**, through the production `runProcess` path:

            - **Start proven**, not assumed: `writeWorkerPID` (`:229`) writes the child PID when invoked with three arguments; the CLI `converter-stall` path passes two and is unaffected.
            - **Reaping proven**: `unix.Kill(pid, 0) == unix.ESRCH` after the response, with `cmd.Run` having waited, so no zombie can satisfy it.
            - **Temporary state proven**: every `host.Temp` directory allocated during the failed conversion must be absent.
            - **Classification and recovery**: 504 for the blocked child, 413 for the flooding child with `Limit = 4096`, no source text in the body, then the same Org URL returns 200 with content — covering slot reuse.
            - The vacuous pre-cancelled-context weakness no longer carries the case, and `TestMain` (`preview_test.go:97-104`) now routes `converter-stall`/`converter-flood` faults to the native command, so the existing `dense.org` stall/flood coverage survives the routing change instead of silently lapsing.
            - **RED is behavioural**: routing is absent, so the substitution never fires and the page returns 200 against an expected 504/413, as recorded.

            **F2 (memory threshold) — resolved.** `TestRT011_7_RuntimeMemoryAbort` (`worker_test.go:213`) pairs a **positive control** (2.3 MiB structured Org converting under the ordinary 512 MiB bound) with the **same input under a valid lowered 16 MiB bound**, requiring failure, zero output and a `memory limit` diagnostic. A validation-only rejection of small values no longer satisfies the case, the bound stays within the design's injected-private-bound allowance, and no large allocation is required.

            **F3 (RT011.5 converter-delta integration) — resolved.** `TestRT011_5_RepeatedMultiParagraphFootnoteLifecycle` (`native_org_test.go:299`) drives the RT011.2 fixture — repeated `[fn:note]` references with a two-paragraph definition — through the real service: one editable note identified by label and text, **both** rendered associations (`data-hp-footnote-label` count of 2), edit and delete asserted as **exact source bytes** with the unrelated `* Next` tail preserved, and zero notes listed afterwards. Initially GREEN with the oracle correction disclosed.

            **Additional items — resolved.** Exact serialized request allowance plus one-byte excess (`TestRT011_7_ExactRequestAllowance`, with a convergence loop and an explicit stability assertion); `TestRT011_1_NativeOrgRouting` now asserts normalized published content for all four rows, including `source.org` and `source.data`; RT011.2 evidence now cites `TestCheckboxRendering` and the checkbox rows of `TestHTTPBlockAnnotations`, and the second admission command includes them.

            ## Gate checks

            - **Scaffolding**: `internal/orgconvert/worker.go` is unchanged — request record plus an always-failing `Worker`, imported only by tests. No production routing exists, so `TestRT011_1_PackagedNativeWorker` still fails on the missing private mode rather than on compilation.
            - **Recorded states are accurate**: RT011.1/6/7 RED on intended assertions; RT011.2/3/4/5 initially GREEN preservation with stated justification; OT011.1/2 and UT011.1/2 AMBER with concrete pending plans (bounded two-build benchmark; release builds, `make vulncheck`, staged native trial; human browser reviews). Preflight-eligible under the declared `AMBER RED | GREEN` sequence.
            - **Boundaries, determinism, doubles**: CLI, loopback HTTP and the real subprocess protocol throughout; doubles confined to the sanctioned `Host` seam and never lowering assertion strength or raising production ceilings; parallel worker subtests independent; retained under `make test` (`go test -race -timeout=20m ./...`). No source greps, no count-equality shortcuts, no test-only production endpoint.

            ## Non-blocking observations (not conditions of this PASS)

            - The RT011.7 `:EVIDENCE:` property still describes only the first run; the started-worker, memory and allowance observations live in the second dated admission section. Traceable, but worth folding into the test node when the delivery-code evidence is written.
            - Scratch-directory assertion assumes session cleanup completes before the response. If it proves asynchronous during implementation, replace it with a bounded wait rather than weakening the check.
            - The recorded revision string ("64b4b81 plus W011 test package and worker scaffold") remains honest while production is untouched; it will need to name the candidate revision at delivery-code.

            Test-code PASS approves the test package only. Implementation may proceed; delivery remains subject to the delivery-code review with RT/OT GREEN.
