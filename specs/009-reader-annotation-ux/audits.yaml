            Rationale for verdict:

            - Scope: the increment implements exactly the recorded operator authorization — editing any supported native footnote (ordinary authored notes and closed HTMLPreview annotations), identified by file and native ID rather than browser memory, with ID/references/attribution preserved, ordinary notes acquiring no ownership metadata, creation retaining the upsert/close protocol, edits using a revision-checked `edit` action with local finish after acknowledgement, read-only original definitions refused, and existing sidecar notes editable. No new dependency (go.mod unchanged), no new service, no browser test architecture.
            - Edit correctness and safety: `editFootnote` shares the writer lock and atomic replacement path; refuses duplicate/ambiguous labels (never guesses), stale definition digests (`footnote_conflict`), stale source revisions (`stale_source`), read-only embedded targets (`read_only_footnote`), and empty text; the ordinary-note re-encode is guarded by a re-parse breakout check (`invalid_footnote`, tested with a heading breakout), and the whole patched file must re-parse cleanly before the rooted, identity-rechecked, metadata-preserving rename. Idempotent equal-text retries synchronize harmlessly; a failed sync after a published rename returns the new inode with the error so the retry path is honest. Owned-note edits preserve the original author, creation date, UUID and state (tested across a fresh writer restart).
            - HTTP boundary: edits ride the existing authenticated v2 route — exact-origin, write-token constant-time compare, composer-token presence, v1 POST still 409 `annotation_upgrade_required` — with grants updated to the replacement inode and polls invalidated. New status codes (`footnote_conflict`, `read_only_footnote`, `invalid_footnote`) map to 409 and the browser maps them to plain recovery guidance.
            - Rendering: conversion-only markers associate Pandoc's repeated-reference endnotes with native labels, are stripped before publication, and the application-owned `data-hp-footnote-label` attribute is narrowly allowlisted on `li`. The remediated marker placement (own leading paragraph) is proven by the rendered-markup test — lists and literal blocks inside definitions retain structure, no token visible. Pandoc still owns the endnotes; the section is relocated, not rebuilt.
            - Composer integration: editing mode fixes the ID read-only, requires non-empty text, updates the digest from `footnote_revision` on acknowledgement, finishes locally without a persisted close record, and exposes the explicit `Use current footnote` recovery. Outside-click/focus-out closing, outline presets exiting plaintext, and the insertion marker all follow the one guarded close path.
            - Evidence: RED (editable state absent) then GREEN recorded for the ordinary-note HTTP test in both formats; focused race checks, build, lint and vulncheck pass. Assertions are behavioural (file bytes, status codes, parsed DOM), not source greps. No prohibited runner execution is claimed; pending human UT and Linux/WSL qualification are correctly left PENDING. The operator-authored v1 annotation suffix in spec.org remains reserved for paired wrap-up.

            Non-blocking observations (optional follow-up, not sign-off conditions):
            1. The retained browser fixture (internal/preview/testdata/annotations-browser.js) is now stale against the panel: its fixture state omits the newly required `footnotes` array (validateAnnotationState would reject it) and its final assertion references the removed `panel.add` property. It is prohibited from execution this iteration, sits outside `make test`, and would fail loudly rather than pass silently if run, so it manufactures no false evidence — but it should be updated or removed at wrap-up before any future re-enablement.
            2. The packaged help line "corrections become new footnotes" predates the editable-footnote amendment; ANNOTATIONS.md fully documents editing, so the help is incomplete rather than false.
