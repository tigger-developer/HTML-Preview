            GATE: implementation
            REVISION: 26a6d64
            VERDICT: FAIL

            Findings (both concrete defects in the current delta; remediation required together)

            **1. Native footnote text is written literal-encoded but read back un-decoded — saved annotations are misreported and re-edited in a different encoding.**

            - Evidence: `internal/annotation/native_attribution.go:53` (`encodeReadableFootnote`) passes every saved comment through `literalFootnoteBody` (`internal/annotation/footnote_patch.go:30`), whose `unsafe` test fires on any of `[]<>*_`~=#\&`, a leading/trailing space, **or any newline**. The published definition therefore contains `#+BEGIN_EXAMPLE`/`#+END_EXAMPLE` (Org) or a fence (Markdown) for most real comments, including any plain two-paragraph comment.
            - The only reader for those definitions is now `EditableFootnotes` (`internal/annotation/footnote_edit.go:60-81`). Since the COMMENT block was removed, every newly written note is `owned == false`, so it takes the `else` branch, which sets `entry.Text` from `splitAttribution(strings.Join(body,"\n"))` and never calls `decodeFootnoteText`. The decoder exists and is applied on the sidecar path (`native_sidecar.go:54`) and on the owned path (`footnote.go:252`); the embedded readable path is the odd one out, and `decodeFootnoteText` even has a branch for the exact leading-newline form this encoder produces (`footnote.go:310`).
            - Consequences, all observable at the authorized HTTP boundary: `state.Footnotes` (`internal/preview/service_annotations.go:185`) returns `"\n#+BEGIN_EXAMPLE\n…\n#+END_EXAMPLE"` instead of the text that was saved; `openComposer` loads that string into the textarea (`assets/web/annotations.js:215`) and `useCurrentFootnote` restores it (`annotation-composer.js:207`); and `patchEditableFootnote` (`footnote_edit.go:168-195`) writes the edit **raw**, so the create path and the edit path persist the same comment in two different encodings, and some text creation accepts is refused by the edit path as `invalid_footnote`.
            - Why this is not covered: `TestRT009_6_NativeExportPreservesLiteralComment` still passes because it exercises `UpdateFootnote`/`Parse`, i.e. the framed intermediate buffer that `readableFootnotes` now converts away before publication; it no longer touches the published representation. Every create-path test uses plain text (`"Draft value N"`, `"A draft"`, `"First comment"`), so no test observes a create → reload → read round trip for the "annotation text containing markup/delimiter-like strings" that RT009.6's own setup requires.
            - Required remediation: make the write and read encodings symmetric for definitions this tool writes, and add a regression that creates an annotation containing markup and multiple paragraphs, reloads it through the v2 GET, and asserts the returned `text` equals the saved text. Note that decoding unconditionally in `EditableFootnotes` would mangle *ordinary authored* notes that legitimately contain an EXAMPLE block or a fence, so either restrict decoding to the tool's own encoding, or drop the literal encoding from `encodeReadableFootnote` and rely on the same re-parse breakout guard the edit path already uses (`footnote_edit.go:192`). The choice is the implementer's; the round trip must hold and ordinary notes must remain byte-stable.

            **2. `--hp-accent` is undefined, so the new clickable-footnote focus ring and the editing outline render nothing.**

            - Evidence: `assets/web/preview.css:204` `.hp-annotations .hp-editable-footnote:focus-visible { outline: 2px solid var(--hp-accent); … }` and `:205` `.hp-editing-footnote { outline: 2px solid var(--hp-accent); … }`. The defined token is `--accent` (`preview.css:3,4`); `--hp-accent` is never defined in `preview.css`, `page.html`, the Go-generated CSS prefix (`internal/preview/html.go:275`, font faces only), or `preview.js` (the only custom property set from script is `--hp-bar-height`, `preview.js:414`).
            - An unresolvable `var()` makes the declaration invalid at computed-value time, so `outline` computes to `unset` (initial `outline-style: none`) rather than falling back to the lower-specificity `:focus-visible` rule at `preview.css:19`. Result: the footnote blocks that this increment made keyboard-focusable (`annotations.js:418`, `tabIndex = 0`) have **no visible focus indicator**, and the `hp-editing-footnote` marker applied to the reference being edited (`annotations.js:462`) shows no outline.
            - This defeats an explicit approved requirement — "Visible focus, named controls, textual state and reflow are required" (spec Accessibility impact) and "A visible outline marks the document insertion point while editing" (operator decision, 14 September) — and it is precisely the kind of defect the pending paired visual check would catch; that check is still PENDING in `validation.org`, so nothing else currently covers it. Biome does not validate custom-property references, so the recorded lint pass is not evidence here.
            - Required remediation: reference the defined token (or define `--hp-accent`), and confirm the focus ring and editing outline in the paired review that is already pending.

            Non-blocking observations (not conditions)

            - Evidence currency: `validation.org` correctly records the full race suite as pending at this candidate (preview package outstanding). Remediating the above changes Go and CSS behaviour, so the complete `make test` must be run at the remediated revision; the focused W007/W009 runs quoted in the caller context do not substitute for it.
            - `internal/preview/testdata/annotations-browser.js` (unchanged, `0229fa2e…`) remains stale against the current panel and is outside `make test` and prohibited from execution this iteration, so it manufactures no false evidence; it should be updated or removed at wrap-up.
            - The operator-authored v1 annotation suffix at the end of `spec.org` is reserved for paired wrap-up per the caller context and the definition gate; it is not treated as an implementation instruction here.
            - No audit findings, verdicts, revisions, round numbers or session IDs are duplicated in `spec.org`, `validation.org` or the docs; `validation.org:61` correctly links to the harness-owned record instead of restating it.

            What is sound (for context, not re-litigation)

            - Metadata removal is genuine and proven at the file boundary: `readableFootnotes` converts every owned frame to an ordinary definition before publication, frames exist only in the working buffer (`native_attribution.go:94`, `replace.go:212-229`), and `TestRT009_6_NoCommentMetadata` plus `TestRT009_7_HTTPCurrentFootnotes` assert no `#+BEGIN_COMMENT`/`HTMLPREVIEW_ANNOTATION` survives, with RED recorded for the hidden-metadata regression.
            - Optional attribution and native timestamps round-trip byte-for-byte across both formats and all three attribution shapes (`TestRT009_4_OptionalNativeAttribution`), unattributed notes stay unattributed, and creation identity survives a fresh writer (`TestRT009_7_EditClosedPreservesAttribution`).
            - Date display is day-first, 24-hour (`en-IE`, `hourCycle:'h23'`, `annotations.js:429`), native Org stamps are shown verbatim with a valid `datetime`, and the Edit buttons are gone in favour of the clickable/`Enter`-activated shaded block with an accessible name.
            - The write boundary is unchanged in substance: shared lock, rooted `O_NOFOLLOW` handles, `nlink==1`, owner/mode preservation with refusal when metadata cannot be preserved, identity and alias recheck immediately before rename, directory sync, and honest uncertain-durability recovery — all still exercised by the injected-fault tests.
            - Sidecar reconstruction from readable `Context:` lines, legacy read/import with history discarded, `409 annotation_upgrade_required` for v1 mutation, and the authored-body revision excluding all native footnotes regardless of origin all behave as the recorded authority describes.
