        1. Hygiene: no annotation records or blocks in spec.org; no duplicated audit findings, status, revisions or session IDs; audit state referenced only via the permitted audits.yaml link. No feedback log is required since no annotations were processed. SCHEMA 5, change-specific title, correct Synopsis with CUSTOM_ID: summary and the eight categories, security impact present, hands-off log free of fabricated entries.

        2. Requirements and traceability: AC009.1–AC009.15 are observable and falsifiable, each linked to tests, and RT009.1–RT009.8, UT009.1–UT009.4 and OT009.1 link back to their ACs. New ACs for current-value storage (AC009.10), native placement (AC009.11), editable ID (AC009.12), constrained replacement (AC009.13), legacy preservation (AC009.14) and one native footnote view (AC009.15) each have concrete negative cases in RT009.6/7 (duplicate/invalid IDs, clearing semantics, no-Git assertion, byte-identical ordinary footnotes). The Synopsis faithfully mirrors the revised design, including the withdrawn autosave history and the 14 September endnote correction.

        3. Supersession and transition: withdrawal of W007's event-log/append-only storage, selected-passage targets and separate appendix is explicit and consistent across spec, work.org, Vision and Architecture. The transition contract is complete: v2 protocol with same admission/tokens/limits, v1 mutation retired with a named 409 error and reload guidance, v1 decoder retained solely for legacy reading/import, migration only on a successful authorized save to the written destination, no dual write path, and an explicit rebuild/restart compatibility statement. This is justified coexistence with a stated retirement condition, not an unexplained parallel path.

        4. Source replacement safety: the save transaction (reread under lock, private sibling temp, metadata preservation with refusal when unsupported, identity recheck before atomic rename, directory sync, uncertainty reconciliation) addresses the larger write consequence of replacement versus append. The probe-based insertion-point proof is bounded to one candidate conversion within existing budgets. The documented limit that rename is not cross-process compare-and-swap is honest. OT009.1 is a correctly bounded native qualification with explicit bounds and pending-platform honesty.

        5. KISS and proportionality: the design reduces rather than adds mechanisms — native footnote syntax instead of a custom store, one moved DOM endnotes section instead of a second renderer, point insertion instead of sentence segmentation, no iframe, no raw-source endpoint, no new dependency. The marker round-trip probe is the only non-trivial new mechanism and is justified by insertion-point correctness with an explicit failure mode (unmappable point). The editable-ID metadata block is required by the operator's renaming/retry requirements. No template-inflation mechanisms identified.

        6. Tests: honest classification (persistent Go/browser regressions extending the existing runner, human UT for pointer accuracy/touch/screen-reader/phone, one bounded OT for native replacement); RED expectations stated; RT009.4 controls locale/timezone explicitly; RT009.8 uses parsed DOM and real navigation; RT009.6 includes Pandoc native-reader round-trip of saved files. The Pandoc 3.9.0.2 HTML observations are correctly framed as bounded design probes, not test evidence.

        7. Pending items correctly left open: operator sign-off (with the check/X closing convention honestly marked as proposed, not pre-approved) and pending Linux/WSL/actual-phone qualification, without manufactured evidence. Prior round findings: none to resolve — this is a materially revised definition reviewed fresh.

        No blocking findings. Optional observation only (not grounds for FAIL): test-definition ordering places RT009.8 after UT009.4/OT009.1, which is cosmetic and does not affect traceability.
