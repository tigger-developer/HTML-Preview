            GATE: delivery-code
            REVISION: ab2f25f
            VERDICT: PROVISIONAL PASS

            ## Conformance verified

            - **Placement and copy separation** — `assets/web/page.html:13` emits the button as the first element of `#hp-header-row`, immediately before `#hp-source`, with `data-hp-source` only on the filename node. `enhanceHeader` (`assets/web/preview.js:94`) still resolves `[data-hp-source]`, so the copy target is unchanged and the control sits outside it. Matches AC015.1.
            - **State model** — `enhanceTheme` (`preview.js:69-91`) reads `prefers-color-scheme` until `documentElement.dataset.hpTheme` is set; nothing is stored or sent. Click and media-query listeners share the existing `controller.signal`, and the disposer re-hides the button on teardown. Matches the recorded design.
            - **Refresh survival** — `swapRegions` (`assets/web/annotations.js:892`) replaces `hp-header` and the other region nodes but never `documentElement`, so the page-local override survives annotation refresh, and `enhancePreview` re-enhances the fresh header's button. The spec's claim is supported by code, not assumed.
            - **CSS coherence** — every `@media (prefers-color-scheme:dark)` block (`preview.css:5,11,67-71,109,152`) has a matching explicit `:root[data-hp-theme=dark]` block (`4,10,64-66,108,151`), each media form guarded by `:root:where(:not([data-hp-theme=light]))`. The `:where()` guard keeps automatic detection at base specificity while the explicit selector outranks it. Print (`preview.css:228-229`) re-declares on `:root,:root[data-hp-theme]` later in the sheet, so it outranks both automatic and explicit dark; `:238` hides the control and `:241` forces code spans to `--fg`.
            - **Security and scope** — no network, storage, dependency, permission or source-writing change; CSP script/style hashes (`internal/preview/html.go:205`) recompute over the changed assets. The delta contains no persistence, configuration or W013 work.
            - **Records** — `spec.org` and `validation.org` contain no audit findings, verdicts, revisions, round numbers or session identifiers. Schema matches `ORG-SCHEMA.md`: AC015.1/AC015.2 tagged `:ac:`, RT015.1/UT015.1 tagged `:testdef:`, `#+TODO: AMBER RED | GREEN` declared, GREEN RT with REVISION/COMMAND/EVIDENCE, AMBER UT with REASON. UT015.1 remaining AMBER is correct for this gate, and the HTTP evidence does not overclaim computed styles.

            ## Required follow-up (bounded, reversible)

            1. **Rerun the affected regression pack.** `page.html`, `preview.css` and `preview.js` are the single shared presentation assets for every converted preview, so the affected set is the whole `internal/preview` package, not one pack. `validation.org` records only `TestRT015_1_ThemeControl` and the `TestRT002_` pack, and states plainly that the full suite was not rerun — honest reporting, but incomplete against `TESTING.md` ("rerun the affected automated tests ... before the delivery-code audit"). Run `make test` (`go test -race -timeout=20m ./...`) or at minimum `go test -race ./internal/preview`, and record the result against `ab2f25f`. The RT015.1 `REVISION` property currently names `4340b9e plus W015 ... changes`; name the audited revision when recording the rerun.

            2. **Assert the no-JavaScript edge case.** `spec.org` Edge Cases require the inert control to stay hidden without JavaScript, and Solution Design states `page.html` "places a hidden native button". `page.html:13` does emit `hidden`, but `internal/preview/theme_test.go:22-31` asserts placement, `type`, `aria-label`, copy-target separation and the absent root override without asserting `hidden` — at the same rendered-HTML boundary it already inspects. Add that assertion; no new framework or boundary is needed.

            3. **Correct two stale placement sentences.** `README.md:94` ("The filename is left-aligned in the sticky info bar, with controls to the right") and `docs/ARCHITECTURE.md:547` ("places the directory and emphasized filename on the left, controls on the right") no longer describe the delivered bar, which now carries a control at the far left before the filename. Both documents state the correct placement elsewhere (`README.md:73-77`, `docs/ARCHITECTURE.md:21-27`), so this is an internal inconsistency introduced by the delta rather than missing documentation. `DOCUMENTATION.md` requires updating documentation affected by behaviour changes; amend both clauses. Voice, purpose fit, version bumps (README 6, Architecture 9) and changelog entries in the new passages are otherwise compliant.

            ## Review limitation

            `annotationRegistrationURL`, used by `theme_test.go:45`, is defined outside the supplied evidence and was not read; its behaviour is taken from the recorded GREEN run, not verified here. `docs/SERVICE.md`, `docs/FORMATS.md` and `docs/ANNOTATIONS.md` were not supplied; the spec records their interfaces as unchanged, which is consistent with the delta I reviewed but not independently confirmed.
