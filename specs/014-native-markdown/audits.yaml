            ## Blocking findings

            **F1 — Synopsis omits the required performance outcome**

            - **Evidence:** Context/Problem leads with "External Markdown conversion adds latency"; Context/Outcome requires "reduces measured uncached preview latency against the current master baseline"; AC014.8 - Faster uncached Markdown previews and OT014.1 - End-to-end comparison make it falsifiable. Synopsis Outcome, After and Changes never state it.
            - **Violation:** `ISSUES.md`, Unified specification — the summary "omits no material change... A mismatch blocks the definition gate."
            - **Required remediation:** State the measured-latency outcome and its master-baseline boundary in the Synopsis (Outcome or After), consistent with AC014.8.

            **F2 — The native dialect contract leaves line-break rendering undecided**

            - **Evidence:** `assets/pandoc/markdown.txt` (the current bundled Markdown dialect) enables `+hard_line_breaks`, so every newline inside a Markdown paragraph currently renders as a line break. The native contract specifies "CommonMark plus the named Goldmark extensions", under which an intra-paragraph newline is ordinary whitespace. Solution Design / Native dialect enumerates much smaller deltas (one-/two-tilde strikeout, bare URLs not autolinked, smart punctuation) but is silent here; RT014.2's Cases and "independent expectations for each converter delta" define no expectation for it.
            - **Impact:** Rendered line breaking changes for every wrapped paragraph in existing Markdown, including `README.md`, `docs/*.md` and `testdata/linked-preview/notes.md`. The annotation contract is unaffected (canonical text whitespace-normalizes either way), so nothing else will catch it; the delivery agent must invent the choice.
            - **Violation:** SDLC `ARCHITECTURE.md`, "Definition must resolve the important decisions"; `ISSUES.md`, "Open questions that can materially change those facts must be resolved in the specification before implementation."
            - **Required remediation:** State the intended behaviour in the native dialect contract (retain current hard line breaks, or adopt CommonMark soft breaks) with its short rationale, add the matching RT014.2 case, and record it in Synopsis/Changes if the rendering changes. Either choice is acceptable; silence is not.

            **F3 — A superseded W011 regression assertion is not identified**

            - **Evidence:** `internal/preview/native_org_test.go`, `TestRT011_1_ServedOrgAndMarkdown` fails unless `pandoc.Load() != 0` for a served `.md` preview — it asserts that Markdown *does* invoke Pandoc, as the contrast proving Org does not. AC014.1 - Native Markdown routing reverses this, so the assertion must be amended during delivery. Context / Authority supersedes only W008's "mandatory startup discovery and the selected Markdown conversion contract".
            - **Violation:** `ISSUES.md`, Brownfield context pass ("Make missing, conflicting, stale, or unresolved sources explicit") and Change control ("identify superseded behaviour rather than silently rewriting history"); `TESTING.md`, regression packs as brownfield evidence.
            - **Required remediation:** Name the superseded assertion with its descriptor in Context/Authority or the handoff, and state that its Org half must be preserved rather than the test deleted.

            **F4 — Bare commit identifier**

            - **Evidence:** OT014.1 Procedure: "Build baseline =720e635= and candidate in isolated temporary checkouts."
            - **Violation:** `MAIN.md`, universal rules ("Never present a bare identifier to a human... commit ID"); `ISSUES.md`, Identifiers and human communication ("The same rule applies to test IDs, ticket numbers, findings, and commit hashes").
            - **Required remediation:** Give the hash an adjacent descriptor, for example "=720e635= - last code-bearing master revision before this change".

            ## Advisory only (not grounds for the verdict, no scope expansion implied)

            - Research evidence names "Goldmark v2" and "gomarkdown" as compared candidates without module paths, while the selected v1.8.6 carries two source links. Adding their identifiers would make the comparison reproducible.
            - The unsupported-construct list omits `implicit_figures` (an image-only paragraph currently becomes `figure`/`figcaption`). It falls under the general no-promise clause, but belongs with the named deltas.
            - Dependency discovery moves native code/plaintext wrapper language admission from Pandoc's catalogue to Chroma, superseding `docs/FORMATS.md` "Wrapper language admission still uses the installed Pandoc catalogue". AC014.6 covers that native previews work without Pandoc; no expectation records the changed admission set. One RT014.6 case would close it.
            - The handoff correctly lists `docs/ARCHITECTURE.md`; its existing approval narration ("Taḋg approved…") is not a model for the new text under `DOCUMENTATION.md` voice rules.

            ## Checks that passed (do not "fix" these)

            - **Annotation and audit hygiene:** `spec.org` contains no semantically identified annotation record or block, resolved or empty; the HTML source block and its `<!-- … -->` examples are ordinary content. No audit findings, verdicts, revisions, round numbers or session IDs appear. `OPERATOR_SIGNOFF: PENDING` is correct. No `feedback.yaml` was supplied and nothing indicates processed annotations.
            - **Schema 8 structure:** all fixed level-one sections present; eight level-two Synopsis categories; every AC tagged `:ac:`, every test tagged `:testdef:`, unique IDs, every AC traced to at least one test and every test to an AC.
            - **Test classification and TDD fit:** RT014.1–7 exercise the executable, real local HTTP and parsed DOM, not source text; OT014.1 (performance comparison) and OT014.2 (packaging, licence, vulncheck, documentation) are correctly one-off rather than persistent suites; UT014.1–2 correctly reserve layout, legibility and interaction for user validation. No browser automation, Node or test-only framework is introduced.
            - **Design verified against implementation evidence:** the stated Goldmark→application footnote normalization matches what the code actually requires — `finalizeVirtualNotes` needs `a[role=doc-noteref]` as the marker text node's next sibling, `labelRenderedFootnotes` needs `li` under `ol` under `role=doc-endnotes`, `renderComments` selects `section.footnotes`, and `TestRT011_2_FootnoteHTMLContract` rejects `sup`-wrapped references. `hp-frontmatter` is a real region replaced by `swapRegions` and outside `#hp-document`, so a banner there stays out of canonical text. The Markdown metadata claim matches `fidelity.lua` `display_metadata`. Worker bounds match `internal/orgconvert/worker.go`. RT014.4's selection algorithm matches `annotationBlockFor` in `annotations.js`.
            - **Proportionality:** one pinned dependency, reuse of the existing native worker, Chroma, YAML library, sanitizer and annotation writer; server-side adaptation instead of a browser or storage rewrite; existing Markdown metadata display retained. No mechanism appears to have been added to fill a template section, and no materially simpler design meets AC014.1–7 with the annotation contract intact.
