        **F1 — resolved.** Synopsis/After now requires lower median latency for uncached previews and annotation saves against the pre-migration master baseline on the same machine and corpus, consistent with AC014.8 - Faster uncached Markdown previews and OT014.1 - End-to-end comparison.

