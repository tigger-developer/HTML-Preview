        2. Missing GREEN for the specialist annotation refresh: TestRT007_1_ReaderSelectionSurvivesAnnotationRefresh passes with race in the final run (optional-path-final.log).

        3. The narrower implicit-suffix defect: a .markdown_strict link without a selector was inactive (optional-link-red.log RED); the correction authorizes the destination at link time and resolves the reader only when followed, through the existing serveDocument/catalogueFor boundary (optional-negative-final.log, optional-path-final.log). Unsupported suffixes return non-success without raw bytes. The strengthened TestRT014_1_ServedMarkdownNeverInvokesPandoc counts every Pandoc invocation, including discovery, over a native page containing an unvisited optional-reader link: the eager experiment failed with three calls (deferred-discovery-red.log); the delivered code passes with zero. Deferral is required by AC014.1 and is recorded in the spec's hands-off decision log and documented in FORMATS.md.

        Disputed parts withdrawn as unsupported:

        4. Specialist annotation regression: requestFormat validates explicit selectors against the lazily discovered optional catalogue before identifyFormat runs, and formatCatalogue.resolve returns documentFormat(selected) unconditionally for a non-empty selection, so the native-only base catalogue never gates a selected reader; buildHTTP also embeds the resolved reader in the advertised endpoint and page URLs. TestRT007_1 passed with HTTP 200 and writable=true before the production correction (optional-path-diagnostic.log) and passes after it.

        5. Optional media regression: serveMedia reidentifies with grant.source.input.reader, a non-empty explicit reader following the same unconditional selected-reader path. TestRT006_12_ContainerMediaOwnership passed unchanged for DOCX, ODT and EPUB, including raster GET/HEAD and invalidation after source mutation, before and after the correction.

        Gate checks verified: all RT014.1–014.7 and OT014.1–014.2 GREEN; UT014.1/014.2 remain explicitly AMBER for operator validation as this gate permits. The affected tests were rerun with the race detector and pass; the link-admission increment touches no conversion, annotation-write, worker or browser code, so the earlier full-suite, performance, packaging, release and dependency evidence remains applicable, and make lint passes. Changed documentation (README, FORMS, ARCHITECTURE, VISION, SERVICE, help, notices, examples) is accurate for the delivered behaviour, including deferred optional-reader discovery, and the changed sections follow DOCUMENTATION.md's impersonal factual voice. spec.org and validation.org contain no duplicated audit findings, verdicts, rounds or session identities. No unauthorized scope: the only new dependency is pinned Goldmark 1.8.6 with its MIT licence distributed.
