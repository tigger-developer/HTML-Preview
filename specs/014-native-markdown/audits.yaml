            ## Finding dispositions

            **F2 — withdrawn; the challenge is correct and my factual basis was wrong.**

            - `assets/pandoc/markdown.txt` reads `-gutenberg-hard_line_breaks+header_attributes`. I split that token run incorrectly and reported `+hard_line_breaks`. The bundled dialect **disables** hard line breaks, so soft breaks already reflow and the migration introduces no line-break change. Nothing belongs in Synopsis/Changes.
            - The new **Line breaks** entry in the dialect contract is accurate on the evidence: `-hard_line_breaks` disables newline-as-break, `+escaped_line_breaks` (present in the same file) gives the backslash hard break, and two trailing spaces produce a break by default — matching the supplied probe output and CommonMark. RT014.2's **Line-break cases** state the soft break, both hard-break forms, and the single annotation end for a wrapped paragraph. Retained as a correct clarification, not a required change.

            **F1 — resolved.** Synopsis/After now requires lower median latency for uncached previews and annotation saves against the pre-migration master baseline on the same machine and corpus, consistent with AC014.8 - Faster uncached Markdown previews and OT014.1 - End-to-end comparison.

            **F3 — resolved.** Context/Authority adds a **Superseded contrast** entry naming `TestRT011_1_ServedOrgAndMarkdown`, replacing only its Markdown Pandoc-call expectation and expressly preserving its Org, linked-navigation and mixed-format checks, with an instruction not to delete or weaken it.

            **F4 — resolved.** OT014.1 labels `720e635` as the pre-migration master baseline, documentation refresh. That matches the commit's actual subject.

            **Advisories — addressed or correctly respected.** Compared modules now carry paths and pins with an explicit statement that neither is added; implicit image figures are named in the unsupported list with the retained image and alternative text; RT014.6 adds a **Language admission** case proving Chroma highlighting with Pandoc absent and with a catalogue lacking Go, plus unchanged plaintext mappings and unavailable-lexer behaviour, feasible through the existing executable-boundary double; documentation voice respected.

            ## Re-checks on the revised package

            - **No regressions:** no annotation record or block of any kind; no audit findings, verdicts, revisions, round numbers or session IDs; `OPERATOR_SIGNOFF: PENDING`; schema 8 structure, `:ac:`/`:testdef:` tagging and unique IDs intact; every AC traced to at least one test and every test to an AC.
            - **Synopsis consistency holds:** the added latency outcome exists below the break; the line-break decision is correctly absent from Changes because nothing changes.
            - **No scope growth:** the 1,999 added bytes are the four remediations and the advisory clarifications. No new product behaviour, dependency, storage, browser change or security surface. The accepted subset and shared-browser boundary are untouched.
            - **Design, architecture fit and test strategy** stand as assessed: server-side adaptation over the existing native-worker pattern, reuse of Chroma, the YAML library, the sanitizer and the annotation writer; RT/UT/OT classification and TDD suitability appropriate; mandatory security impact present.
