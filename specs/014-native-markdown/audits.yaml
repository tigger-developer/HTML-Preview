            ## Basis reviewed

            Read in full: the signed-off `spec.org` (schema 8) and `validation.org`; the new tests (`native_markdown_test.go`, `markdown_annotation_contract_test.go`, `markdown_boundaries_test.go`) and the reused/changed ones (`native_org_test.go`, `annotation_target_contract_test.go`, `checkboxes_test.go`, `contents_defaults_test.go`, `footnote_service_test.go`, `annotation_service_test.go`, `annotation_security_test.go`, `service_cache_test.go`, `preview_test.go`); fixtures `testdata/native-markdown/semantics.md` and `testdata/annotation-targets/blocks.md`; all four execution logs; `Makefile`, `go.mod`, `.sdlc/project.yaml`; production `render.go`, `formats.go`, `annotation_blocks.go`, `service_http.go`, `orgconvert/worker.go`; SDLC `MAIN.md`, `TESTING.md`, `AUDITS.md`, `technologies/GO.md`.

            **Accepted without further comment:** boundaries (built CLI through the subprocess harness, real local HTTP service, `golang.org/x/net/html` selectors reproducing browser precedence independently of the converter's own registry); doubles confined to the existing `Host.Execute`/`LookPath` boundary; synthetic fixtures and `t.TempDir` isolation; `make test` runs `-race`; no production behaviour added (no Goldmark in `go.mod`, `render.go`/`formats.go` unchanged) and no scaffolding that implements the target behaviour; RED evidence is intended-assertion failure, not compilation or setup failure (`TestRT014_6_NativeServiceWithoutPandoc`'s "service did not become ready" *is* the assertion under test); RT014.5 initially GREEN preservation is legitimate and honestly explained; recorded states in `validation.org` match the logs; changing `TestRT011_1_ServedOrgAndMarkdown`'s Markdown expectation while retaining its Org assertions is exactly what the specification authorizes; OT/UT AMBER is correct at this gate and product documentation is not demanded here.

            The findings below are all **coverage or oracle defects against the signed-off RT definitions**. No requirement is reopened and no new scope is introduced. For any item already protected by an existing test I did not see, citing that test in the resumed round is acceptable remediation.

            ## Findings

            **F1 — RT014.1/AC014.1: no evidence that annotation projection and block-proof conversions avoid Pandoc.**
            `TestRT014_1_ServedMarkdownNeverInvokesPandoc` is the only test counting Pandoc `--from=markdown` calls, and it fetches the linked page in ordinary reading mode; it never creates a note and never fetches the advertised refresh URL. The tests that *do* create notes (`TestRT014_4_ClickableMarkdownCreation`, `TestRT014_5_…`) install no counter. AC014.1 names "subsequent annotation projection and block-proof conversions" and RT014.1's Action requires "the advertised refresh URL; create a note and fetch the resulting page".
            *Remediation:* keep the Pandoc counter installed across an annotation-registered Markdown page load, `bootstrap["page_url"]` refresh, a successful note creation and the post-save fetch, asserting zero Markdown Pandoc invocations.

            **F2 — RT014.2: unsupported-qualifier rejection has a weak oracle that Pandoc already satisfies.**
            `TestRT014_2_NativeDialect` runs the selector cases with the ambient PATH, and `TestRT014_2_ServedSelectorRejection` asserts status only. `rt-package-red.log` shows `markdown+unknown` already exits 2 today, and `final-test-additions.log` shows the served case returning 415 via `formats.validateSelection`, i.e. via Pandoc's `--list-extensions`. These cases therefore cannot detect violations of "Unknown qualifiers never select Pandoc" and "Do not pass native qualifiers to Pandoc for validation"; they would pass on a wholly non-compliant implementation.
            *Remediation:* exercise the native-qualifier rejections (including the 256-character grammar case) on the native-only PATH, or with an `Execute` interceptor that fails on any `pandoc` invocation, for both CLI exit 2 and HTTP 400.

            **F3 — RT014.2: enumerated cases not covered.**

            - `markdown-raw_html` ("retains omission") is never exercised; only `+smart`, `-smart`, `-smart+smart` and the rejected qualifiers are.
            - Metadata contract is asserted only as unordered text presence. The signed-off contract requires title/author/date/lang **as paragraphs in that order when a body exists** and a **structured frontmatter definition list for metadata-only documents**; neither the ordering nor the metadata-only document is tested.
            - Markdown fenced code: `semantics.md` contains a ```` ```go ```` block but `TestRT014_2_MetadataAndHeadingContract` asserts only that `pre`/`code` exist. "Copy payloads preserved, known languages receive Chroma spans, unknown languages remain literal" is unasserted for Markdown (the Chroma assertions in RT014.6 use `.go` *source files*, a different route).
            - Fragment resolution: heading IDs are asserted to exist, but no link fragment (intra-document, e.g. `blocks.md`'s `[a local link](#heading-emphasis)`, or cross-document) is asserted to resolve to a generated ID. `TestRT003_1_FormatContentsDefaults` covers cross-document links, not fragments.

            (The "nested footnotes containing code or lists" case *is* covered — `TestRT009_8_EditableNotesPreserveRenderedMarkup/md` — no action needed there.)

            **F4 — RT014.3: warning-delivery cases not covered.**

            - No document containing **several distinct raw-HTML regions** (e.g. inline + block + comment) asserting exactly one warning, and no **multi-document CLI invocation** asserting one notice per affected document. The current fixtures each hold a single region, so "one per document, not one per node" is only weakly evidenced.
            - **Browser-followed document link** to Markdown containing raw HTML: not covered (the link-following test uses HTML-free Markdown).
            - **Note refresh**: no assertion that the banner survives, unchanged, the page returned after saving an annotation.
            - **Unchanged SSE traffic must not repeat the warning**: no coverage; if this cannot be exercised at the existing public boundary, record that reason rather than leaving it silently absent.
            - **Native `.html` keeps its separate policy**: `TestRT014_6_OptionalDependencyCLI` previews `native.html` but asserts only exit status — neither that the authored HTML is retained nor that no omission notice is emitted.
            - Related: `TestRT014_4_MarkdownRejectsUnverifiedTargets` scans only `hp-document` descendants, so the banner region itself is never proven non-writable, although RT014.3's "warning stays out of the canonical body" assertions cover the substantive risk.

            **F5 — RT014.5: "add two notes to one block" is not exercised.**
            `TestRT014_5_RepeatedMarkdownNoteLifecycle` covers load/edit/idempotent retry/stale conflict/delete; `TestRT014_4_…` creates one note per block plus one on a *different* paragraph. Two distinct stored notes attached to the same block — and the resulting sidebar records and source boundary — appear nowhere.
            *Remediation:* add the second creation on an already-annotated block, asserting two sidebar records, correct labels and the exact source insertion boundary.

            **F6 — RT014.6: the "with the dependency" half of the dependency matrix is missing.**
            The only DOCX case uses an invalid fixture (`"not a real archive"`) on a Pandoc-free PATH, so "successful DOCX conversion remains available with the dependency" is untested; RT014.6 explicitly requires isolated PATHs with **absent, supported and failing** optional converters. Likewise, "existing explicitly plaintext mappings stay literal" and "an unavailable native lexer follows the existing literal-text notice behaviour" are not evident anywhere in the supplied package.
            *Remediation:* add a real minimal DOCX fixture (or the project's existing one) converted with Pandoc present; cover the plaintext-mapping and unavailable-lexer expectations, or cite the existing tests that already do.

            **F7 — RT014.7: out-of-root local resources for Markdown are not exercised.**
            `TestRT014_7_MarkdownPassiveContent` covers remote fetch suppression, `javascript:` URLs, forged block attributes, metadata injection, diagnostics leakage and source immutability, but no out-of-root local resource reference (e.g. an image path escaping the authorized root), which RT014.7's Action names and which is converter-sensitive because link/image rewriting changes with the reader. Missing-token/wrong-Origin/unauthorized-write reuse via `TestRT007_7_AnnotationHTTPAuthority` is accepted.

            **F8 — bounded mechanical corrections.**

            - `markdown_annotation_contract_test.go:72-75`: the comment "Remove just the expected owned additions to prove the body wasn't rewritten" is not what the code does — it only checks the first line as a prefix. Either compare the full expected source (original plus the two owned additions) or correct the comment; as written it claims more evidence than it produces.
            - `native_markdown_test.go:112` "empty" case: `want` is `""`, making the content assertion vacuous (`strings.Contains(x, "")`). The case still proves successful rendering; make the intent explicit or assert the empty body directly.
