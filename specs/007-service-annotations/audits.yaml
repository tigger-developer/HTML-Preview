      response: |-
        `EHLO SOUL OPS`
        I have read the canonical agent instructions in full. I pledge to uphold their rules, the spirit of these same rules, and that I will not attempt to game these same rules.

        **Evidence limitation (read first):** five manifest files were **not readable** in this session (permission denied, all outside cwd): `~/.agents/sdlc/templates/v3/spec.org`, `~/.agents/skills/define-change/SKILL.md`, and the three Writeback prior-art files. I therefore did **not** verify exact v3 template conformance, the define-change skill's procedural requirements, or the spec's asserted Writeback findings. No review of those files is claimed. All other manifest files were read in full.

        ```
        GATE: definition
        REVISION: specs/007-service-annotations/spec.org@sha256:c032df3d (candidate on master; git not invocable in this session)
        VERDICT: FAIL
        ```

        **Clean:** AC↔test traceability is complete in both directions (AC007.1–24 all proven; RT007.1–11, UT007.1–9, OT007.1–2 all carry Covers). Tests are behaviour-level at real boundaries with an explicit "no source-text assertions" rule — no grep-the-source tests. No audit findings, status, revisions, round numbers or session IDs are duplicated in the spec; `DEFINITION_GATE`/`OPERATOR_SIGNOFF` are the mandatory fields only. W007 proposal notices exist in both named authorities (`docs/VISION.md:24-39`, `docs/ARCHITECTURE.md:34-53`). The W006 dependency and implementation hold are stated correctly and consistently with `docs/work.org:145-177`.

        ## Findings and required remediation

        **F1 — Concurrent-append contract contradicts AC007.9 (blocking).**
        `revision` is SHA-256 over source **plus sidecar bytes**, and every append changes it. Two tabs on one document — a supported case (RT007.11 Setup, AC007.9, Edge Cases) — therefore invalidate each other on every autosave, bounded by "two automatic rebases per snapshot", then a visible waiting state. Under continuous typing in both tabs, saving can stall indefinitely, which contradicts AC007.9's "concurrent tabs retain their own records".
        *Remediation:* state whether an annotation-only change makes a pending append stale. Either gate appends on `source_revision` plus store-tail/sequence validity, or record the accepted stall behaviour with an acceptance criterion and expected outcome for two simultaneously composing tabs.

        **F2 — 429 has no client behaviour (blocking, same area).**
        Per-document busy returns 429 with "no waiting queue", but the Retry rule covers only "Network/503 failures". A routine transient 429 between two writers becomes a user-visible failure in a feature whose headline behaviour is silent autosave.
        *Remediation:* define the client's 429 handling (retry schedule and bound, or explicit non-retry with named recovery) in the Autosave/Retry contract and in RT007.5 or RT007.10.

        **F3 — Display-name setting contradicts the established strict-settings contract (blocking).**
        `internal/preview/config.go:134-136` rejects any unknown `HTMLPREVIEW_*` variable, and invalid values exit 2 (asserted in `internal/preview/contracts_test.go:63-69`); W006 AC006.17 keeps invalid configuration an error that never degrades to success. W007 specifies an invalid explicit `HTMLPREVIEW_USER_DISPLAY_NAME` is diagnosed while the preview still opens without creation. The spec neither registers the new variable in the validated set nor names the exception.
        *Remediation:* state that the variable joins the strict settings validation, and either record the deliberate exception to the invalid-setting exit contract (with the exit status in AC007.4 and RT007.2) or align it to the existing error behaviour.

        **F4 — `heading_id` stability is not supported by the current renderer (blocking).**
        Targets use "an optional **stable** source/custom heading ID", and refresh restores folds from "surviving stable heading/drawer IDs". `internal/preview/render.go:288-306` assigns a section ID from custom ID, else a Pandoc text slug, else ordinal `heading-N`, and `:252-254` deletes `data-hp-custom`/`data-hp-org-id` provenance. Neither browser nor server can tell a stable source ID from a text-derived slug or a shifting ordinal, so a wrong `heading_id` can disambiguate between duplicate quote candidates.
        *Remediation:* define how `heading_id` provenance is determined and preserved in the rendered DOM, or state that non-source IDs are never used as corroborating context for reattachment or fold restoration.

        **F5 — The persistent browser harness is undefined where it decides runnability (blocking).**
        `docs/ARCHITECTURE.md:585` records "No browser harness is selected by this document"; W006 excludes a "persistent browser harness" (W006 spec, Maintainability). W007 introduces `make test-browser`, opening the **system default browser**, without recording that supersession and without specifying: behaviour when no browser or display is available (headless CI, SSH, WSL); whether CI and the ordinary gate include it; what engine coverage a pass can claim when the default browser varies per host; flake/retry policy; and whether the run leaves a window for a human to dismiss. RT007.5, RT007.8, RT007.9 and RT007.11 depend on it.
        *Remediation:* record the supersession with rationale, and specify unavailability behaviour (skip versus fail), CI/gate inclusion, engine-coverage claim and flake policy.

        **F6 — Superseded product/architecture boundaries not named (documentary).**
        Automatic polling refresh delivers what `docs/VISION.md:188` excludes as "live reload" and what W006 excludes as "live-reload watchers"; writes narrow Vision's "leave the source untouched". Only the source-writing exception is named in the W007 Authority/Unchanged/Compatibility sections and the two proposal notices.
        *Remediation:* name the live-reload supersession alongside the write exception, as W006 did for the persistent-service exclusion.

        **F7 — AC007.19 has no persistent regression (coverage).**
        Accessible browser interaction is proven only by human UT007.5/UT007.6, while a browser regression harness is being introduced and the mechanical parts (accessible names, focus return, textual status in a live region, no colour-only status) are automatable.
        *Remediation:* add the mechanical checks to a browser RT (RT007.8 already runs a browser regression page) or record why the whole criterion is human-only.

        **F8 — Composer-limit overflow unspecified (minor).**
        "At most 64 active service composers" has no stated outcome, unlike the 256 document grants (503). Eviction would conflict with "only the active composer may append".
        *Remediation:* state the status code and user-visible behaviour at the composer limit, and that no active composer is evicted.

        **F9 — Per-test intended RED is absent (minor, consistency).**
        Every W006 RT records an "Intended RED"; W007 relies on one global sentence plus two named tests in Delivery Handoff, leaving nine RTs with no recorded intended failure. I could not read the template, so I raise this as inconsistency with the approved sibling, not as asserted template non-conformance.
        *Remediation:* record the intended RED per RT, or state that the global rule is deliberate.

        **Not findings, recorded as verified positions:** embedded-history privacy and growth (disclosed, with no compaction and visible capacity failure); the external-editor overwrite limit (stated, not overclaimed); frozen-on-close composer semantics (matches the operator's 12 September acceptance); Markdown/Org frame escaping (delimiters cannot be produced from user strings); no hosted-deployment expansion (Exodan boundary is described, not adopted).
