            ## Prior findings — all resolved

            - **F1 concurrency.** `source_revision` is now the optimistic write precondition and the full `revision` is an explicit read/refresh cursor; annotation-only appends by another composer no longer stale a pending request (Revision, Save race, Compare). Framing, per-annotation next-sequence, operation identity and store validity still run under the writer lock. The initial two-line-ending store separator is defined as part of the stripped owned tail, so creating a store does not itself change the authored digest — this closes the loophole the first fix would otherwise have left. AC007.9/AC007.11 reworded to match; RT007.5 drives two composers from a shared source revision and UT007.4 adds 30 seconds of overlapping two-tab typing.
            - **F2 429.** Busy now joins network and transient 503 in the 1/2/4-second retry with 0–250 ms jitter and a `Retry-After: 1` floor, ending in explicit *Not saved*/Retry; named capacity errors are correctly excluded from automatic retry. RT007.5 and RT007.10 separate transient from sustained contention.
            - **F3 settings.** `HTMLPREVIEW_USER_DISPLAY_NAME` joins the strict known-settings set; an invalid resolved name exits 2 before registration or browser opening, and unknown `HTMLPREVIEW_*` still fails. This matches `internal/preview/config.go:134-136` and the status-2 expectations in `internal/preview/contracts_test.go:63-69`. Missing values remain a read-only success.
            - **F4 anchoring.** `heading_id` may now name only a verified explicit Org `CUSTOM_ID`/`ID` captured into a provenance map *before* the catalogue strips `data-hp-custom`/`data-hp-org-id` — the correct seam, given `internal/preview/render.go:252-254`. Pandoc slugs, ordinal `heading-N` fallbacks and raw HTML/Markdown IDs are explicitly non-corroborating, source HTML cannot forge the map, and drawers return to their folded default across source change. RT007.9 exercises shifting ordinals, changed slugs and forged provenance.
            - **F5 browser harness.** The supersession of W006's exclusion and the Architecture's unselected-harness baseline is recorded in the specification and in `docs/ARCHITECTURE.md:50-56`. Unavailable browser, display or WSL handoff fails with a diagnostic and never counts as a pass; headless CI runs Go tests and reports browser coverage unexecuted; actual engine and version are recorded; no flake retry or quarantine; the result tab may remain with an instruction to close it.
            - **F6 live reload.** Bounded polling supersedes the exclusion in the specification, `docs/VISION.md:41-43` and Architecture, with recursive watchers and file-mode reload still excluded.
            - **F7 accessibility coverage.** AC007.19 now has RT007.8 alongside the human UTs, and RT007.8 specifies mechanical roles, accessible names, keyboard activation, focus return and polite textual status independent of colour, leaving screen-reader intelligibility to UT007.6. The link is reciprocal.
