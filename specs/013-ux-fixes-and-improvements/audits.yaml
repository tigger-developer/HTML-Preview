            Scope confirmed: this envelope covers the AC013.3/AC013.4 input-guard increment at the candidate revision, with the unchanged AC013.2 block-target correction and its retained GREEN RT013.2 evidence carried in the delivered state (its prior attempts were incidents without verdicts; I reviewed that code from the supplied evidence rather than rerunning it).

            Verified in this increment:
            - Tests and evidence: OT013.1 GREEN with revision, command-level evidence and honest limits (including the recorded no-match test selection followed by the full writer-package rerun); UT013.3/UT013.4 AMBER with reasons, which delivery-code permits since the operator excludes browser automation and no JS test runner exists. Server-side enforcement retains real RT coverage (TestRT007_7_10 4001-character and 4097-emoji 413 rejections with unchanged source bytes; writer breakout rejection "Paragraph\n\n\n* New heading" → invalid_footnote). No-RT for the input-event layer is justified and recorded, not a coverage evasion.
            - Guard design: beforeinput cancellation for insert/paste, input-event fallback commit that restores text, selection, direction and scroll on rejection, composition deferred to compositionend with whole-commit validation, drop/undo covered by the fallback, rejected text never reaches composer.input, pre-existing oversized notes open with a notice and permit progressive shortening while composer.valid() suspends autosave. Fixed limits (4,000 code points / 16 KiB) match the server contract; no YAML surface added. Org versus Markdown versus Org-sidecar destination flag is correct, including read-only Markdown sources writing to an Org sidecar. Feedback uses the existing reserved status space, aria-live and existing amber pending styling; no new layout row, modal, dependency, endpoint or widened access. Docs (ANNOTATIONS.md v6, work.org, spec ledger) are accurate, impersonal and current; validation.org carries no duplicated audit state.
            - The blank-line scan's slice(1, -1) off-by-one is correct for blank semantics: the first textarea line becomes the definition's own line and the final unterminated line is the typing line, so "first\n\n" stays typable and the third Enter is refused.

            Finding (bounded follow-up; does not invalidate implementation sign-off):
            1. annotation-input.js annotationOrgBoundary skips the first textarea line entirely, including block-delimiter recognition. A #+BEGIN_... block opened as the note's first line is therefore untracked, so two consecutive blank lines inside it are falsely rejected by both the input guard and AnnotationComposer.valid(), although the writer accepts exactly this form (encodeFootnote/encodeReadableFootnote add the leading newline for a first-line literal body and the definition reparse validates). The adjacent comment's claim that the first line "cannot itself be a blank line or block delimiter" is inaccurate for delimiters. Required correction: apply the case-insensitive #+BEGIN_ opener recognition to the first line as well, while keeping the first line exempt from blank-line counting. Rejected input retains text and selection, so there is no data loss; the deviation is over-rejection of valid Org content in a narrow case against the increment's own rule to "match the writer's block recognition".

            The AMBER browser UTs (UT013.2, UT013.3, UT013.4) remain the operator's pending validation under the paired contract and are not verdict conditions.
